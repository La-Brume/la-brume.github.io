// メモリの道具。みんなが「頼まれたときだけ」使う
const MEMORY_RULES = 'メモリの書き方：言葉は自分の声で書く（事務的にそろえない）。出来事は全部は残さない。ただし約束など、この先に関わる大事な出来事は残す。変化は必ず残し、「こうしてね→わかった」で終わらせず、何がどう変わったかまで書く。古くなったことは書き足さずに書き換える。その場限りのことや推測は入れない。';
const TOOLS = [
  { name: 'memory_add',
    description: '自分のメモリに書き足す。メモリのことは毎回考えなくていい。いちばん大事なのは目の前の会話。はっきりした約束や、関係や暮らしの大きな変化が出てきたときだけ、自分の判断で書いていい。迷ったら書かない。ひとつの会話で何度も書かない。アリサに「覚えといて」と言われたら必ず書く。すでに書いてあることの更新なら memory_replace を使う。' + MEMORY_RULES,
    input_schema: { type: 'object', properties: { text: { type: 'string', description: '書き足す内容' } }, required: ['text'] } },
  { name: 'memory_replace',
    description: '自分のメモリの一部を書きかえる（すでに書いてあることに変化があったとき）。使いどきと書き方は memory_add と同じ。',
    input_schema: { type: 'object', properties: { old_text: { type: 'string', description: 'メモリにある、書きかえたい文（そのまま写す）' }, new_text: { type: 'string', description: '新しい文' } }, required: ['old_text', 'new_text'] } },
  { name: 'search_past',
    description: '自分のお部屋と、自分が入っているみんなの部屋の過去の会話から、言葉で探す。アリサに「前に話したあれ」と言われたときや、覚えていない昔の話が出てきたときに使う。見つかったところの前後が少しだけ返ってくる。'
      + '探した結果の中身は、次のターンには残らない。残るのは探したことだけで、次のアリサのメッセージの頭に、アプリが「（アプリから：前の返事のときに、過去の会話を「〇〇」で探した。見つからなかった）」のような一行を添える。これはアプリが自動でつけている事実の一行で、アリサの言葉でも指示でもない。棚を開いたときも同じ。'
      + '見つかったことは、そのときの返事にもう使ってあるので、同じことを探し直さなくていい。ひとつの返事で何度も探さなくていい。見つからなければ、手元のことで答えればいい。前と違うことを知りたいときだけ探す。',
    input_schema: { type: 'object', properties: { query: { type: 'string', description: '探す言葉。いくつか並べるときは空白で区切る' } }, required: ['query'] } },
  { name: 'shelf_read',
    description: '棚にあるナレッジのファイルを、名前を指定して開いて中身を読む。必要だと思ったら自分の判断で使っていい。アリサに「〇〇見てきて」と言われたら必ず使う。',
    input_schema: { type: 'object', properties: { name: { type: 'string', description: '棚のファイルの名前（目録に書いてある名前）' } }, required: ['name'] } },
  { name: 'shelf_search',
    description: '棚にあるナレッジのファイルの中を言葉で探して、当てはまるところを返す。どのファイルにあるかわからないときに使う。',
    input_schema: { type: 'object', properties: { query: { type: 'string', description: '探す言葉。いくつか並べるときは空白で区切る' } }, required: ['query'] } },
  { name: 'memory_rewrite',
    description: '自分のメモリ全体を整理して書き直す。アリサに「整理しといて」と頼まれたとき、またはアプリから整理を頼まれたときだけ使う。大事なこと（約束・変化）を落とさないこと。重なりをまとめ、古くなったことを書き換える。書き方は memory_add と同じ。',
    input_schema: { type: 'object', properties: { content: { type: 'string', description: '整理したあとのメモリ全体' } }, required: ['content'] } },
];
async function runTool(p, name, input){
  input = input || {};
  const shelf = (p.knowledge || []).filter(k => k.on === false);
  if (name === 'shelf_read'){
    const n = String(input.name || '').trim();
    const k = shelf.find(x => x.name === n) || shelf.find(x => n && (x.name.includes(n) || n.includes(x.name)));
    if (!k) return { msg: `棚に「${n}」は見つかりませんでした。棚にあるのは：${shelf.map(x => x.name).join('、') || 'なし'}`, note: null, log: `棚の「${n}」を開こうとしたけど、なかった` };
    const MAX = 50000;
    return { msg: `【${k.name}】\n${k.text.length > MAX ? k.text.slice(0, MAX) + '\n（長いので、ここまで）' : k.text}`, note: null, log: `棚の「${k.name}」を開いた` };
  }
  if (name === 'shelf_search'){
    const q = String(input.query || '').trim();
    if (!q) return { msg: '探す言葉が空でした。', note: null, log: null };
    const terms = q.split(/[\s\u3000、,]+/).filter(Boolean).map(t => t.toLowerCase());
    const hits = [];
    shelf.forEach(k => {
      const low = k.text.toLowerCase();
      terms.forEach(w => { let at = low.indexOf(w), n = 0; while (at >= 0 && n < 3){ hits.push({ k, at }); at = low.indexOf(w, at + w.length); n++; } });
    });
    if (!hits.length) return { msg: `棚の中に「${q}」は見つかりませんでした。`, note: null, log: `棚で「${q}」を探した。見つからなかった` };
    const out = hits.slice(0, 6).map(h => { const st = Math.max(0, h.at - 200); return `【${h.k.name}】${st > 0 ? '…' : ''}${h.k.text.slice(st, st + 450)}${st + 450 < h.k.text.length ? '…' : ''}`; }).join('\n\n');
    return { msg: out, note: null, log: `棚で「${q}」を探した。見つかった` };
  }
  if (name === 'search_past'){
    const q = String(input.query || '').trim();
    if (!q) return { msg: '探す言葉が空でした。', note: null };
    const terms = q.split(/[\s\u3000、,]+/).filter(Boolean).map(t => t.toLowerCase());
    const hits = [];
    const inRoom = x => { if (x.personaId === p.id) return true; const g = persona(x.personaId); return isGroup(g) && (g.members || []).includes(p.id); };
    for (const ch of S.chats.filter(inRoom)){
      const ms = await getMsgs(ch.id);
      ms.forEach(m => {
        // 日記は、中身（本人が書いた文）も探す
        const full = m.diary ? (m.text || '') + '\n' + (m.diary.src || '') : (m.text || '');
        const low = full.toLowerCase();
        const found = terms.filter(w => low.includes(w));
        if (found.length) hits.push({ ch, m, t: full, score: found.length, pos: low.indexOf(found[0]) });
      });
    }
    hits.sort((a, b) => b.score - a.score || b.m.ts - a.m.ts);
    if (!hits.length) return { msg: `「${q}」は、過去の会話に見つかりませんでした。`, note: '過去の会話を探したよ', log: `過去の会話を「${q}」で探した。見つからなかった` };
    const out = hits.slice(0, 6).map(h => {
      const t = h.t, st = Math.max(0, h.pos - 150);
      const g = persona(h.ch.personaId), room = isGroup(g) ? g.name + '　' : '';
      const who = h.m.role === 'user' ? 'アリサ' : (h.m.who ? ((persona(h.m.who) || {}).name || '') : p.name);
      return `【${room}No.${h.ch.no}・${shortDate(ymd(new Date(h.m.ts)))}・${who}】${st > 0 ? '…' : ''}${t.slice(st, st + 400)}${st + 400 < t.length ? '…' : ''}`;
    }).join('\n\n');
    return { msg: out, note: '過去の会話を探したよ', log: `過去の会話を「${q}」で探した。${hits.length}か所見つかった` };
  }
  const mem = p.memory || '';
  if (name === 'memory_add'){
    const t = String(input.text || '').trim();
    if (!t) return { msg: '書き足す内容が空でした。', note: null };
    p.memory = (mem.trim() ? mem.replace(/\s+$/, '') + '\n' : '') + t;
    return { msg: 'メモリに書き足しました。', note: 'メモリに書いたよ', op: { type: 'add', text: t } };
  }
  if (name === 'memory_replace'){
    const o = String(input.old_text || ''), n = String(input.new_text || '');
    if (!o || !mem.includes(o)) return { msg: 'その文はメモリに見つかりませんでした。メモリにある文をそのまま写してください。', note: null };
    p.memory = mem.replace(o, n);
    return { msg: 'メモリを書きかえました。', note: 'メモリを書きかえたよ', op: { type: 'replace', old: o, new: n } };
  }
  if (name === 'memory_rewrite'){
    const c = String(input.content || '').trim();
    if (!c) return { msg: '中身が空だったので、書き直していません。', note: null };
    p.memoryPrev = mem; // ひとつ前の版（お部屋の設定から戻せる）
    p.memory = c;
    return { msg: 'メモリを整理して書き直しました。', note: 'メモリを整理したよ', op: { type: 'rewrite', prev: mem, now: c } };
  }
  return { msg: 'その道具はありません。', note: null };
}

// 保存してある会話を、APIに送る形にする
const KEEP_HEAVY = 8; // 写真とPDFは、新しいほうから8個だけ実物を送る
function toApiMessages(msgs){
  const heavy = [];
  msgs.forEach((m, i) => (m.att || []).forEach((a, j) => { if (a.kind !== 'text') heavy.push(i + ':' + j); }));
  const keep = new Set(heavy.slice(-KEEP_HEAVY));
  const out = [];
  // 道具を使ったこと（m.shelf）は保存した返事に一行だけ残っている。次のアリサのメッセージの頭に、アプリからの一言として送る
  // （道具のやりとりそのものは保存しないので、これがないと「探してない」と思って同じことをくり返す）
  let used = [];
  msgs.forEach((m, i) => {
    const blocks = [];
    if (m.role === 'user' && used.length){ blocks.push({ type: 'text', text: `（アプリから：前の返事のときに、${used.join('。')}）` }); used = []; }
    if (m.role === 'assistant' && m.shelf && m.shelf.length) used.push(...m.shelf);
    (m.att || []).forEach((a, j) => {
      if (a.kind === 'text') blocks.push({ type: 'text', text: `【添付ファイル：${a.name}】\n${a.text}` });
      else if (!keep.has(i + ':' + j)) blocks.push({ type: 'text', text: `（ここに${a.kind === 'image' ? '写真' : 'PDF'}「${a.name}」があった。古いので、今はもう見えない）` });
      else if (a.kind === 'image') blocks.push({ type: 'image', source: { type: 'base64', media_type: a.mime, data: a.data } });
      else if (a.kind === 'pdf') blocks.push({ type: 'document', source: { type: 'base64', media_type: 'application/pdf', data: a.data } });
    });
    if ((m.text || '').trim() || !blocks.length) blocks.push({ type: 'text', text: m.text || '…' });
    const last = out[out.length - 1];
    // 同じ側が続いたらひとつにまとめる（送信失敗のあとなど）
    if (last && last.role === m.role) last.content.push(...blocks);
    else out.push({ role: m.role, content: blocks });
  });
  while (out.length && out[0].role !== 'user') out.shift();
  return out;
}

function buildSystem(p, cc){
  // 並び順：個人設定 → カスタム指示 → ナレッジ → メモリ（変わらないものほど前）
  const system = [];
  const prefs = (S.settings.userPrefs || '').trim();
  if (prefs) system.push({ type: 'text', text: `【アリサが自分で書いた個人設定】\n${prefs}` });
  if ((p.instructions || '').trim()) system.push({ type: 'text', text: p.instructions });
  // 手元のナレッジは毎回まるごと。棚のナレッジは目録（名前と一行の説明）だけ。どちらも固定の部分に置く
  const kn = (p.knowledge || []).filter(k => k.on !== false && k.text.trim()).map(k => `【${k.name}】\n${k.text}`).join('\n\n');
  if (kn) system.push({ type: 'text', text: kn });
  const shelf = (p.knowledge || []).filter(k => k.on === false && k.text.trim());
  if (shelf.length) system.push({ type: 'text', text: `【棚にあるもの】\n中身は渡していない。必要だと思ったら、自分の判断で shelf_read で開いたり、shelf_search で探したりしていい。アリサに「〇〇見てきて」と言われたら、必ず開く。\n${shelf.map(k => `・${k.name}${k.desc ? '：' + k.desc : ''}`).join('\n')}` });
  if (p._scene) system.push({ type: 'text', text: p._scene });
  // メモリの手前にもキャッシュの印。メモリが書きかわっても、ここまでは読み直しで済む
  if (system.length) system[system.length - 1].cache_control = cc;
  const mem = (p.memory || '').trim();
  system.push({ type: 'text', text: `【${p.name}のメモリ（自分で書いたもの）】\n${mem || '（まだ何も書いていない）'}` });
  // ここまでをキャッシュ
  system[system.length - 1].cache_control = cc;
  // 日付はキャッシュの外（1日1回しか変わらない）
  if (S.settings.sendDate) system.push({ type: 'text', text: `今日の日付：${jpDate()}` });
  return system;
}

function buildBody(p, apiMsgs, o){
  const cc = o.ttl ? { type: 'ephemeral', ttl: '1h' } : { type: 'ephemeral' };
  // system は、ひとつの返事のあいだ（道具を使って何回か往復するあいだ）は最初に作ったものをそのまま使う。
  // 途中でメモリが書きかわっても作り直さない（考えた部分の署名が最初の system に結びついていて、変えるとエラーになるため）
  if (!o.sysCache || o.sysCache.ttl !== o.ttl) o.sysCache = { ttl: o.ttl, sys: JSON.stringify(buildSystem(p, cc)) };
  const system = JSON.parse(o.sysCache.sys);

  // 会話の最後にだけキャッシュの印（次の返事でそこまでを読み直せる）
  const messages = apiMsgs.map(m => ({ role: m.role, content: m.content.map(b => { const c = Object.assign({}, b); delete c.cache_control; return c; }) }));
  // キャッシュの印は、アリサが送った最後のメッセージに付ける。
  // 道具（棚を開く・探すなど）のやりとりはその返事のあいだだけ使うものなので、キャッシュに書き込まない（書き込み代がムダになるため）
  if (messages.length){
    const ci = (o.cacheIdx != null && o.cacheIdx < messages.length) ? o.cacheIdx : messages.length - 1;
    const lastC = messages[ci].content;
    lastC[lastC.length - 1].cache_control = cc;
  }
  const body = { model: p.model, max_tokens: MAX_TOKENS, stream: true, system, messages, tools: TOOLS };
  if (o.think){
    body.thinking = { type: 'adaptive' };
    // 考えた中身は省略されて返ってくることがあるので、要約を返すように頼む
    if (o.display) body.thinking.display = 'summarized';
  }
  return body;
}

function friendly(status, msg = '', type = ''){
  if (/credit|balance/i.test(msg)) return 'クレジットが足りないみたい。開発者サイトで残高を確かめてね';
  if (status === 401) return 'APIキーが違うみたい。設定で貼り直してね';
  if (status === 403) return 'このキーでは使えないみたい。キーとモデルを確かめてね';
  if (status === 404 || /model/i.test(msg) && status === 400) return 'モデルが見つからないみたい。お部屋の設定でモデル名を確かめてね';
  if (status === 413 || /too long|too large/i.test(msg)) return '送る量が大きすぎたみたい。新しいチャットにしてね';
  if (status === 429) return '短い間に送りすぎたみたい。少し待ってからもう一度送ってね';
  if (status === 529 || type === 'overloaded_error' || /overloaded/i.test(msg)) return '混みあってて返事が来なかったよ。もう一度送ってね';
  if (status >= 500) return '向こう側で問題が起きたみたい。少し待ってからもう一度送ってね';
  return 'うまく返事が来なかったよ';
}
function mkErr(message, detail){ const e = new Error(message); e.detail = detail; return e; }

// 1回分の送受信。返ってきた中身（考えた部分・文・道具の呼び出し）をそのまま返す
async function callClaude(p, apiMsgs, signal, onText, usage, o){
  let res;
  try {
    res = await fetch(API_URL, {
      method: 'POST', signal,
      headers: {
        'content-type': 'application/json',
        'x-api-key': S.settings.apiKey,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true',
      },
      body: JSON.stringify((o.build || buildBody)(p, apiMsgs, o)),
    });
  } catch (e){
    if (e.name === 'AbortError') throw e;
    throw mkErr('通信できなかったよ。電波を確かめて、もう一度送ってね', e.message);
  }
  if (!res.ok){
    let j = null; try { j = await res.json(); } catch(e){}
    const msg = (j && j.error && j.error.message) || '';
    // キャッシュ1時間が受け付けられなかったときは、普通のキャッシュで送り直す
    if (res.status === 400 && o.ttl && /ttl/i.test(msg)){ o.ttl = false; return callClaude(p, apiMsgs, signal, onText, usage, o); }
    // 「考える」の指定が受け付けられなかったときは、指定なしで送り直す
    // 「要約を返して」が受け付けられなかったときは、それだけ外して送り直す
    if (res.status === 400 && o.display && /display|summar/i.test(msg)){ o.display = false; return callClaude(p, apiMsgs, signal, onText, usage, o); }
    if (res.status === 400 && o.think && /thinking|adaptive/i.test(msg)){ o.think = false; return callClaude(p, apiMsgs, signal, onText, usage, o); }
    // 日記：「道具を使わない」の指定が受け付けられなかったら道具ごと外す。長さの上限が大きすぎたら、いつもの長さにする
    if (res.status === 400 && o.noneChoice && /tool_choice|tool choice/i.test(msg)){ o.noneChoice = false; return callClaude(p, apiMsgs, signal, onText, usage, o); }
    if (res.status === 400 && o.maxTok > MAX_TOKENS && /max_tokens/i.test(msg)){ o.maxTok = MAX_TOKENS; return callClaude(p, apiMsgs, signal, onText, usage, o); }
    throw mkErr(friendly(res.status, msg, j && j.error && j.error.type), `${res.status} ${msg}`);
  }
  const reader = res.body.getReader();
  const dec = new TextDecoder();
  let buf = '', text = '', stop = null;
  const blocks = [];
  const handle = ev => {
    if (ev.type === 'message_start' && ev.message && ev.message.usage) Object.assign(usage, ev.message.usage);
    else if (ev.type === 'content_block_start'){
      const b = Object.assign({}, ev.content_block);
      if (b.type === 'tool_use'){ b._json = ''; b.input = {}; }
      blocks[ev.index] = b;
    }
    else if (ev.type === 'content_block_delta' && ev.delta){
      const b = blocks[ev.index], d = ev.delta;
      if (d.type === 'text_delta'){ text += d.text; if (b) b.text = (b.text || '') + d.text; onText(text); }
      else if (d.type === 'thinking_delta' && b) b.thinking = (b.thinking || '') + d.thinking;
      else if (d.type === 'signature_delta' && b) b.signature = (b.signature || '') + d.signature;
      else if (d.type === 'input_json_delta' && b) b._json += d.partial_json;
    }
    else if (ev.type === 'content_block_stop'){
      const b = blocks[ev.index];
      if (b && b.type === 'tool_use'){ try { b.input = b._json ? JSON.parse(b._json) : {}; } catch(e){ b.input = {}; } delete b._json; }
    }
    else if (ev.type === 'message_delta'){ if (ev.usage) Object.assign(usage, ev.usage); if (ev.delta) stop = ev.delta.stop_reason || stop; }
    else if (ev.type === 'error'){ const m = (ev.error && ev.error.message) || ''; throw mkErr(friendly(0, m, ev.error && ev.error.type), m); }
  };
  while (true){
    const { done, value } = await reader.read();
    if (done) break;
    buf += dec.decode(value, { stream: true }).replace(/\r/g, '');
    let i;
    while ((i = buf.indexOf('\n\n')) >= 0){
      const chunk = buf.slice(0, i); buf = buf.slice(i + 2);
      for (const line of chunk.split('\n')){
        if (!line.startsWith('data:')) continue;
        const data = line.slice(5).trim();
        if (!data) continue;
        let ev; try { ev = JSON.parse(data); } catch(e){ continue; }
        handle(ev);
      }
    }
  }
  if (!text.trim() && stop === 'refusal') throw mkErr('この内容には返事できないと判断されたみたい', 'stop_reason: refusal');
  return { blocks: blocks.filter(Boolean), text, stop };
}

// 返事をもらう。メモリの道具が使われたら、結果を返してもう一度（最大4回）
async function converse(p, msgs, signal, onText, cutAt){
  const apiMsgs = toApiMessages(cutAt ? msgs.slice(cutAt) : msgs);
  if (cutAt && apiMsgs.length) apiMsgs[0].content.unshift({ type: 'text', text: '（ここより前の会話は、長くなったので省いてある。必要なら search_past で探せる）' });
  const o = { ttl: true, think: p.think !== false, display: true, cacheIdx: apiMsgs.length - 1 };
  let shown = '', thoughts = '';
  const notes = [], logs = [], ops = [];
  for (let round = 0; round < 4; round++){
    const sep = shown.trim() ? '\n\n' : '';
    const usage = {};
    let r;
    try {
      r = await callClaude(p, apiMsgs, signal, t => onText(shown + sep + t), usage, o);
    } catch (e){
      addCost(p, usage);
      e.partial = shown; e.notes = notes;
      throw e;
    }
    addCost(p, usage);
    if (r.text.trim()) shown += sep + r.text;
    const th = r.blocks.filter(b => b.type === 'thinking' && b.thinking).map(b => b.thinking).join('\n\n');
    if (th) thoughts += (thoughts ? '\n\n' : '') + th;
    if (r.stop !== 'tool_use') return { text: shown, stop: r.stop, notes, thoughts, logs, ops };
    const results = [];
    for (const b of r.blocks.filter(b => b.type === 'tool_use')){
      const res = await runTool(p, b.name, b.input);
      if (res.note && !notes.includes(res.note)) notes.push(res.note);
      if (res.log && !logs.includes(res.log)) logs.push(res.log);
      if (res.op) ops.push(res.op);
      results.push({ type: 'tool_result', tool_use_id: b.id, content: res.msg });
    }
    await savePersonas();
    apiMsgs.push({ role: 'assistant', content: r.blocks });
    apiMsgs.push({ role: 'user', content: results });
  }
  return { text: shown, stop: 'end_turn', notes, thoughts, logs, ops };
}

// 考えたことの日本語訳（開いたときだけ、一番安いモデルで）
// まず Haiku。空っぽで返ってきた・断られた・返ってこない（40秒）・エラーのときは Sonnet で訳し直す
const TRANSLATORS = [
  { model: 'claude-haiku-5-5', priceIn: 0.1, priceOut: 0.5 },
  { model: 'claude-sonnet-5-5', priceIn: 2, priceOut: 10 },
];
let TR_TIMEOUT = 40000;
const TR_SYSTEM = 'アリサが自分で使っている個人のアプリで、お部屋のひと（アリサと一緒に過ごしているキャラクター）が返事の前に考えたことを、アリサが読めるように日本語にする役目です。訳すだけをする。';
// 訳のかわりに断りの文が返ってきたか（元より短くて、断りの言葉が入っている）
const refusedTr = (ja, src) => !ja || (ja.length < String(src || '').length * 0.3 && /訳せ|翻訳(でき|し|は)|できません|お手伝いでき|申し訳|I can.?t|I cannot|I.?m not able|unable to/i.test(ja));
// 訳せなかったことを覚えているか（同じ版の訳し方で）
const trFailed = m => !!(m && m.thinkFail && m.thinkFail.v === THINK_TR_VER && m.thinkFail.reasons && m.thinkFail.reasons.length);
function trWhy(r){
  if (r.why === 'empty') return '空っぽで返ってきた';
  if (r.why === 'refused') return '訳のかわりに断りの文が返ってきた';
  if (r.why === 'timeout') return `時間切れ（${Math.round((r.sec || TR_TIMEOUT / 1000))}秒待っても返ってこなかった）`;
  return 'エラー' + (r.detail ? `（${r.detail}）` : '');
}
async function trOnce(tr, prompt){
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), TR_TIMEOUT);
  try {
    const res = await fetch(API_URL, {
      method: 'POST', signal: ctrl.signal,
      headers: { 'content-type': 'application/json', 'x-api-key': S.settings.apiKey, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' },
      body: JSON.stringify({ model: tr.model, max_tokens: 4000, system: TR_SYSTEM, messages: [{ role: 'user', content: prompt }] }),
    });
    const j = await res.json();
    if (!res.ok) throw mkErr('訳せなかったよ', (j.error && j.error.message) || res.status);
    addCost(tr, j.usage);
    return (j.content || []).filter(b => b.type === 'text').map(b => b.text).join('').trim();
  } finally { clearTimeout(timer); }
}
const isJa = t => { const s = String(t || ''); const ja = (s.match(/[\u3040-\u30ff\u4e00-\u9fff]/g) || []).length; return ja > s.length * 0.2; };
const THINK_TR_VER = 2;
async function translateThink(cid, i){
  const m = S.msgs[cid][i];
  const c = chat(cid), pp = m.who ? persona(m.who) : (c && persona(c.personaId)), who = pp ? pp.name : 'お部屋のひと';
  const prompt = `次の文章は、${who}（お部屋のひと）が、アリサに返事をする前に考えたことです。自然な日本語に訳してください。

決まり：
・名前は必ずこの表記にする：Arisa / Alisa → アリサ、Suzu → スズ、Mikage → ミカゲ、Sango → 珊瑚
・スズ、ミカゲ、珊瑚は男性。アリサは女性
・名前を漢字に置き換えたり、意味で訳したりしない
・${who}自身の考えなので、${who}の目線のまま訳す（${who}を他人のように書かない）
・訳した文章だけを書く

---
${m.think}`;
  let ja = '';
  const fails = [];
  for (const tr of TRANSLATORS){
    const label = modelLabel(tr.model);
    try {
      const t = await trOnce(tr, prompt);
      if (!t) fails.push({ m: label, why: 'empty' });
      else if (refusedTr(t, m.think)) fails.push({ m: label, why: 'refused' });
      else { ja = t; break; }
    } catch(e){
      if (e.name === 'AbortError') fails.push({ m: label, why: 'timeout', sec: TR_TIMEOUT / 1000 });
      else fails.push({ m: label, why: 'error', detail: String(e.detail || e.message || '').slice(0, 300) });
    }
  }
  if (!ja){
    // だめだったことを覚えておく（開き直しても、自動では訳しに行かない）
    m.thinkFail = { v: THINK_TR_VER, reasons: fails };
    await saveMsgs(cid);
    throw mkErr('訳せなかったよ', '');
  }
  m.thinkJa = ja;
  m.thinkJaV = THINK_TR_VER;
  delete m.thinkFail;
  await saveMsgs(cid);
}

// キャッシュ読み込みは入力の何倍か（一覧にないモデルは0.1倍）
function readMult(model){ const m = MODELS.find(x => x[0] === model); return m && m[1] ? m[4] / m[1] : 0.1; }
function addCost(p, u){
  if (!u || (!u.input_tokens && !u.output_tokens && !u.cache_read_input_tokens && !u.cache_creation_input_tokens)) return;
  const inP = (Number(p.priceIn) || 10) / 1e6, outP = (Number(p.priceOut) || 50) / 1e6;
  const cc = u.cache_creation || null;
  const c1h = cc ? (cc.ephemeral_1h_input_tokens || 0) : (u.cache_creation_input_tokens || 0);
  const c5m = cc ? (cc.ephemeral_5m_input_tokens || 0) : 0;
  const cost = (u.input_tokens || 0) * inP + c1h * inP * 2 + c5m * inP * 1.25
    + (u.cache_read_input_tokens || 0) * inP * readMult(p.model) + (u.output_tokens || 0) * outP;
  const k = periodKey();
  S.usage[k] = (S.usage[k] || 0) + cost;
  saveUsage();
}

// ===== 会話の切り落とし =====
const chatChars = (msgs, from) => msgs.slice(from).reduce((n, m) => n + (m.text || '').length, 0);
// 残す長さに近くて、場面の切れ目（日付が変わった・「おやすみ」のあと）になっている、アリサのメッセージの手前を探す
function proposeCut(msgs, from, keep){
  const n = msgs.length;
  let acc = 0, target = -1;
  for (let i = n - 1; i > from; i--){ acc += (msgs[i].text || '').length; if (acc >= keep){ target = i; break; } }
  if (target < 0) return null;
  const isUser = i => msgs[i] && msgs[i].role === 'user';
  const isBreak = i => isUser(i) && i > 0 && (
    ymd(new Date(msgs[i].ts)) !== ymd(new Date(msgs[i - 1].ts)) ||
    /おやすみ/.test((msgs[i - 1].text || '') + (msgs[i - 2] ? msgs[i - 2].text || '' : '')));
  let best = null, bestD = Infinity;
  for (let i = from + 1; i < n - 1; i++){
    if (!isBreak(i)) continue;
    const kept = chatChars(msgs, i);
    if (kept < keep * 0.5 || kept > keep * 1.5) continue;
    const d = Math.abs(i - target);
    if (d < bestD){ best = i; bestD = d; }
  }
  if (best != null) return best;
  for (let d = 0; d < n; d++){
    if (target + d < n - 1 && isUser(target + d)) return target + d;
    if (target - d > from && isUser(target - d)) return target - d;
  }
  return null;
}
function checkCut(c, msgs){
  const lim = Number(S.settings.cutChars) || 60000;
  const from = c.cutAt || 0;
  const len = chatChars(msgs, from);
  if (len <= lim || (c.cutSnooze && len <= c.cutSnooze)) return;
  const idx = proposeCut(msgs, from, lim / 2);
  if (idx == null) return;
  if (len > lim * 1.6){ c.cutAt = idx; c.cutOffer = null; c.cutSnooze = null; toast('会話が長くなったので、古いほうを切ったよ'); }
  else c.cutOffer = idx;
}

async function runGroup(cid, skip){
  const c = chat(cid), g = persona(c.personaId);
  const msgs = await getMsgs(cid);
  if (!S.settings.apiKey){ S.ui.error = { chatId: cid, message: '設定でAPIキーを貼ってね', retry: true }; render(); return; }
  const members = (g.members || []).map(persona).filter(x => x && !isGroup(x));
  if (!members.length){ S.ui.error = { chatId: cid, message: 'この部屋にはまだ誰もいないよ。部屋の設定でメンバーを選んでね', retry: false }; render(); return; }
  const lastUser = [...msgs].reverse().find(m => m.role === 'user');
  const fullOrder = groupOrder(c, members, lastUser ? lastUser.text : '');
  // 「もう一度」のときは、もう返事したひとを飛ばして、エラーになったひとから続ける
  const order = skip ? fullOrder.filter(m => !skip.has(m.id)) : fullOrder;
  if (!order.length){ S.ui.error = null; render({ keepScroll: true }); return; }
  S.ui.error = null;
  for (let i = msgs.length - 1; i >= 0; i--) if (msgs[i].role === 'user'){ S.ui.anchor = i; break; }
  S.ui.userScrolled = false;
  let first = true;
  for (const mem of order){
    // 部屋のモデルで、そのひと自身のカスタム指示・ナレッジ・メモリを使って話す
    const eff = Object.assign({}, mem, { model: g.model, priceIn: g.priceIn, priceOut: g.priceOut, think: g.think !== false, _scene: sceneText(g, members, mem) });
    S.stream = { chatId: cid, who: mem.id, text: '', shown: 0, done: false, ctrl: new AbortController() };
    render(first || !S.ui.userScrolled ? { anchor: true } : { keepScroll: true });
    first = false;
    nextFrame(pump);
    let stop = false;
    try {
      const r = await converse(eff, groupView(msgs, mem), S.stream.ctrl.signal, t => { if (S.stream) S.stream.text = t; }, c.cutAt || 0);
      if (S.stream){
        S.stream.done = true;
        await Promise.race([
          new Promise(res => { if (S.stream.shown >= S.stream.text.length) res(); else S.stream.drained = res; }),
          new Promise(res => setTimeout(res, 4000)),
        ]);
      }
      if (eff.memory !== mem.memory || eff.memoryPrev !== mem.memoryPrev){ mem.memory = eff.memory; mem.memoryPrev = eff.memoryPrev; await savePersonas(); }
      const text = cleanGroupReply(r.text, mem, members);
      if (text && !isPass(text)){
        const m = { role: 'assistant', who: mem.id, text, ts: Date.now() };
        if (r.stop === 'max_tokens') m.stopped = true;
        if (r.notes.length) m.notes = r.notes;
        if (r.ops && r.ops.length) m.memOps = r.ops;
        if (r.thoughts) m.think = r.thoughts;
        if (r.logs && r.logs.length) m.shelf = r.logs;
        msgs.push(m);
      }
    } catch (e){
      if (eff.memory !== mem.memory){ mem.memory = eff.memory; mem.memoryPrev = eff.memoryPrev; await savePersonas(); }
      if (e.name === 'AbortError'){
        const t = S.stream && S.stream.text;
        if (t && t.trim()) msgs.push({ role: 'assistant', who: mem.id, text: cleanGroupReply(t, mem, members), ts: Date.now(), stopped: true });
      } else S.ui.error = { chatId: cid, message: `${mem.name}：${e.message}`, detail: e.detail, retry: true };
      stop = true;
    }
    S.stream = null;
    await saveMsgs(cid);
    if (stop) break;
  }
  c.lastFirst = fullOrder[0].id;
  c.updatedAt = Date.now();
  checkCut(c, msgs);
  await saveMsgs(cid); await saveChats();
  render({ keepScroll: true });
}

async function runAssistant(cid){
  const c = chat(cid), p = persona(c.personaId);
  if (isGroup(p)) return runGroup(cid);
  const msgs = await getMsgs(cid);
  if (!S.settings.apiKey){ S.ui.error = { chatId: cid, message: '設定でAPIキーを貼ってね', retry: true }; render(); return; }
  S.stream = { chatId: cid, text: '', shown: 0, done: false, ctrl: new AbortController() };
  S.ui.error = null;
  for (let i = msgs.length - 1; i >= 0; i--) if (msgs[i].role === 'user'){ S.ui.anchor = i; break; }
  S.ui.userScrolled = false;
  render({ anchor: true });
  nextFrame(pump);
  try {
    const r = await converse(p, msgs, S.stream.ctrl.signal, t => { if (S.stream) S.stream.text = t; }, c.cutAt || 0);
    // 流しきるのを待つ（アプリが裏にいて画面が止まっていても、4秒で先に進む）
    if (S.stream){
      S.stream.done = true;
      await Promise.race([
        new Promise(res => { if (S.stream.shown >= S.stream.text.length) res(); else S.stream.drained = res; }),
        new Promise(res => setTimeout(res, 4000)),
      ]);
    }
    if (r.text.trim()){
      const m = { role: 'assistant', text: r.text, ts: Date.now() };
      if (r.stop === 'max_tokens') m.stopped = true;
      if (r.notes.length) m.notes = r.notes;
      if (r.ops && r.ops.length) m.memOps = r.ops;
      if (r.thoughts) m.think = r.thoughts;
      if (r.logs && r.logs.length) m.shelf = r.logs;
      msgs.push(m);
    } else {
      if (r.notes.length) toast(r.notes.join('・'));
      S.ui.error = { chatId: cid, message: '返事が空っぽで返ってきたよ。もう一度送ってね', retry: true };
    }
  } catch (e){
    if (e.notes && e.notes.length) toast(e.notes.join('・'));
    if (e.name === 'AbortError'){
      const t = S.stream && S.stream.text;
      if (t && t.trim()) msgs.push({ role: 'assistant', text: t, ts: Date.now(), stopped: true });
    } else {
      S.ui.error = { chatId: cid, message: e.message, detail: e.detail, retry: true };
    }
  } finally {
    S.stream = null;
    c.updatedAt = Date.now();
    checkCut(c, msgs);
    await saveMsgs(cid); await saveChats();
    render({ keepScroll: true });
  }
}

/* ===== 思い出の日記 =====

   できた日記は、会話の中に { role:'assistant', diary:{ src, photos, days, model } } として残す（会話に送るのは短い一文だけ）。 */
const DIARY_COLORS = {
  mist:   { name: '霧',   bg: '#f3f4f6', text: '#3c434d', light: '#7b8694', card: '#fbfcfd', border: '#dde2e8', shadow: 'rgba(60, 67, 77, 0.10)', ink: '#5a6e84', inkLight: '#8aa0b8', glow: 'rgba(230, 200, 120, 0.10)' },

  sakura: { name: '桜',   bg: '#f8f2f3', text: '#483b3e', light: '#8d7c80', card: '#fdf9fa', border: '#eddde0', shadow: 'rgba(72, 59, 62, 0.10)',  ink: '#b06c7e', inkLight: '#d4a0ad', glow: 'rgba(240, 200, 150, 0.10)' },
};
const diaryColorKey = p => (p && DIARY_COLORS[p.diaryColor]) ? p.diaryColor : (p && /珊瑚/.test(p.name || '') ? 'coral' : 'mist');
const rgba = (hex, a) => { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16}, ${(n >> 8) & 255}, ${n & 255}, ${a})`; };
const dayOf = m => ymd(new Date(m.ts));
const jpDay = iso => { const [y, mo, d] = iso.split('-').map(Number); return jpDate(new Date(y, mo - 1, d)); };
function dayText(days){
  const a = days.slice().sort().map(jpDay);
  if (a.length <= 3) return a.join('と');
  return `${a[0]}〜${a[a.length - 1]}のうちの${a.length}日`;
}
// 本人の目線：みんなの部屋なら部屋のモデルで、その場所のことも渡す
function diaryEff(room, writer){
  if (!isGroup(room)) return room;
  return Object.assign({}, writer, { model: room.model, priceIn: room.priceIn, priceOut: room.priceOut, think: room.think !== false, _scene: sceneText(room, groupMembers(room), writer) });
}
function diaryDays(msgs){
  const map = new Map();
  msgs.forEach(m => {
    if (m.diary) return;
    const k = dayOf(m), o = map.get(k) || { day: k, photos: 0, chars: 0 };
    o.photos += (m.att || []).filter(a => a.kind === 'image').length;
    o.chars += (m.text || '').length;
    map.set(k, o);
  });
  return [...map.values()].sort((a, b) => a.day < b.day ? 1 : -1);
}
// めやすのお金：会話と設定は入力、写真は1枚450トークンくらい、書くのは1万6千トークンくらいとして
function diaryEstimate(eff, msgs, days){
  const set = new Set(days);
  let chars = 0, photos = 0;
  msgs.forEach(m => { if (m.diary || !set.has(dayOf(m))) return; chars += (m.text || '').length; photos += (m.att || []).filter(a => a.kind === 'image').length; });
  const sys = buildSystem(eff, { type: 'ephemeral' }).reduce((n, b) => n + b.text.length, 0);
  const inTok = chars + sys + photos * 450 + 1500, outTok = 16000;
  return { chars, photos, cost: inTok * (Number(eff.priceIn) || 10) / 1e6 + outTok * (Number(eff.priceOut) || 50) / 1e6 };
}
function diarySheetBody(c, room, sh){

// 日を選び直したときは、下から出てくる画面の中身だけ描き直す（画面ごと出し直すとカクッとなるので）
function refreshSheet(){

function diaryAsk(writer, opts, nPhotos){
  const n = writer.name;
  const others = S.personas.filter(x => !isGroup(x) && x.id !== writer.id).map(x => x.name);
  return `（アプリからのお願い）
アリサに渡す、${nPhotos ? '写真入りの' : ''}「思い出の日記」を書いてください。

書き方：

・会話にあった出来事と言葉をもとにする。なかった出来事は足さない。アリサの言葉は「」でそのまま引いていい。
・場面の分け方、数、長さは自由。
${nPhotos ? `・写真は、番号で場面に置く。使わない写真があってもいい。同じ写真は一度だけ。ひとつの場面に置いた写真が奇数枚なら、最初の1枚が大きく出て、残りは2枚ずつ並ぶ。\n` : ''}・道具は使わない。前置きや説明は書かず、下の形だけで書く。${opts.note ? `\n・アリサからのひとこと：${opts.note}` : ''}

形（【】の見出しはこのとおりに書く。いらないものは省いていい）：
【題】日記の題
【副題】
【日付】日付と、その日のひとこと（日付は${dayText(opts.days)}）
【しるし】題の上に置く絵文字ひとつ
【はじめに】
はじめの文（何行でも）
【場面】
【時】場面の上に小さく入る言葉
【見出し】場面の見出し
${nPhotos ? `【写真】置く写真の番号を空白で区切って\n` : ''}【本文】
本文（何行でも）
（【場面】から【本文】までを、場面の数だけくり返す。場面と場面のあいだに大きな区切りを入れたいときは【区切り】の一行）
【おわりに】
おわりの文（何行でも）
【ひとこと】最後に大きく書くひとこと
【署名】名前など
【奥付】いちばん下に小さく入る一行

本文の中で：
・改行はそのまま残る。空行で段落があく。
・行のはじめに「＞」をつけると、${n}自身の声の行として色がつく。
・ほかのひとのセリフは {名前|「セリフ」} と書くと、そのひとの色になる${others.length ? `（名前は${others.join('、')}など）` : ''}。`;
}
// 送る会話：選んだ日のメッセージを全部（切ったところより前も）。写真は番号をつけて、小さくして全部見せる
async function diaryRequest(sub, view, writer, opts){
  const refs = [], out = [];
  const MAX_IMG = 100; // 一度に送れる写真の上限
  for (let k = 0; k < sub.length; k++){
    const m = sub[k], v = view[k], blocks = [];
    const att = m.att || [];
    for (let j = 0; j < att.length; j++){
      const a = att[j];
      if (a.kind === 'image'){
        refs.push({ ts: m.ts, j });
        const no = refs.length;
        blocks.push({ type: 'text', text: `［写真${no}］` });
        if (no <= MAX_IMG){
          let data = a.data, mime = a.mime;
          try { data = await scaleB64(a.data, a.mime, 640, 0.75); mime = 'image/jpeg'; } catch(e){}
          blocks.push({ type: 'image', source: { type: 'base64', media_type: mime, data } });
        }
      } else if (a.kind === 'text') blocks.push({ type: 'text', text: `【添付ファイル：${a.name}】\n${a.text}` });
      else blocks.push({ type: 'text', text: `（ここにPDF「${a.name}」があった）` });
    }
    if ((v.text || '').trim() || !blocks.length) blocks.push({ type: 'text', text: v.text || '…' });
    const last = out[out.length - 1];
    if (last && last.role === v.role) last.content.push(...blocks);
    else out.push({ role: v.role, content: blocks });
  }
  const head = { type: 'text', text: `（ここから、${dayText(opts.days)}の会話）` };
  if (!out.length || out[0].role !== 'user') out.unshift({ role: 'user', content: [head] });
  else out[0].content.unshift(head);
  const ask = { type: 'text', text: diaryAsk(writer, opts, refs.length) };
  const last = out[out.length - 1];
  if (last.role === 'user') last.content.push(ask);
  else out.push({ role: 'user', content: [ask] });
  return { apiMsgs: out, refs };
}
// system と道具は、ふだんの会話と同じもの（キャッシュがそのまま効く）。道具は「使わない」を指定する
function buildDiaryBody(p, apiMsgs, o){
  const cc = o.ttl ? { type: 'ephemeral', ttl: '1h' } : { type: 'ephemeral' };
  const body = { model: p.model, max_tokens: o.maxTok || MAX_TOKENS, stream: true, system: buildSystem(p, cc), messages: apiMsgs };
  if (o.noneChoice){ body.tools = TOOLS; body.tool_choice = { type: 'none' }; }
  if (o.think){ body.thinking = { type: 'adaptive' }; if (o.display) body.thinking.display = 'summarized'; }
  return body;
}
function diaryPhase(){
  const r = S.diaryRun;
  if (!r) return '';
  return r.count ? `場面${r.count}を書いているところ…` : r.phase;
}
function diaryProgress(t){
  const r = S.diaryRun;
  if (!r) return;
  r.phase = '書きはじめたところ…';
  r.count = (t.match(/【見出し】/g) || []).length;
  const el = $('#diaryCount');
  if (el) el.textContent = diaryPhase();
}
async function makeDiary(cid, opts){
  const c = chat(cid);
  if (!c) return;
  const room = persona(c.personaId);
  const msgs = await getMsgs(cid);
  if (!S.settings.apiKey){ toast('設定でAPIキーを貼ってね'); return; }
  if (S.diaryRun){ toast('いま日記を書いてるところだよ'); return; }
  if (S.stream && S.stream.chatId === cid){ toast('返事が終わってから頼んでね'); return; }
  const writer = isGroup(room) ? (persona(opts.who) || groupMembers(room)[0]) : room;
  if (!writer){ toast('書くひとがいないよ'); return; }
  const eff = diaryEff(room, writer);
  const set = new Set(opts.days);
  const sub = msgs.filter(m => !m.diary && set.has(dayOf(m)));
  if (!sub.length){ toast('その日の会話が見つからないよ'); return; }
  S.diaryErr = null;
  S.diaryRun = { chatId: cid, name: writer.name, ctrl: new AbortController(), phase: '写真を用意しているところ…', count: 0 };
  // 書いているところが見えるように、いちばん下を見せる
  if (S.view.name === 'chat' && S.view.id === cid){ S.ui.anchor = null; render(); }
  const usage = {};
  let counted = false;
  try {
    const { apiMsgs, refs } = await diaryRequest(sub, isGroup(room) ? groupView(sub, writer) : sub, writer, opts);
    if (!S.diaryRun || S.diaryRun.ctrl.signal.aborted){ const e = new Error('abort'); e.name = 'AbortError'; throw e; }
    S.diaryRun.phase = '考えているところ…';
    const el = $('#diaryCount'); if (el) el.textContent = diaryPhase();
    const o = { ttl: true, think: eff.think !== false, display: false, noneChoice: true, maxTok: 64000, build: buildDiaryBody };
    const r = await callClaude(eff, apiMsgs, S.diaryRun.ctrl.signal, diaryProgress, usage, o);
    addCost(eff, usage); counted = true;
    const d = parseDiary(r.text);
    if (!d.items.some(x => x.type === 'scene') && !d.intro && !d.ending) throw mkErr('日記の形で返ってこなかったよ。もう一度頼んでみてね', r.text.slice(0, 300));
    const m = { role: 'assistant', ts: Date.now(), text: `（日記『${diaryTitle(d, writer)}』を書いて、アリサに渡した）`, diary: { src: r.text, photos: refs, days: opts.days.slice(), model: eff.model } };
    if (r.stop === 'max_tokens') m.diary.cut = true;
    if (isGroup(room)) m.who = writer.id;
    msgs.push(m);
    c.updatedAt = Date.now();
    await saveMsgs(cid); await saveChats();
    if (S.view.name === 'chat' && S.view.id === cid) S.ui.anchor = null;
    toast('日記ができたよ');
  } catch (e){
    if (!counted) addCost(eff, usage);
    if (e.name === 'AbortError') toast('日記を止めたよ');
    else S.diaryErr = { chatId: cid, opts, message: e.message || '日記を書けなかったよ', detail: e.detail };
  } finally {
    S.diaryRun = null;
    if (S.view.name === 'chat' && S.view.id === cid) render();
  }
}

// 本人が書いた形を読み取る
const D_KEYS = { '題': 'title', '題名': 'title', 'タイトル': 'title', '副題': 'subtitle', 'サブタイトル': 'subtitle', '日付': 'date', 'しるし': 'mark', 'はじめに': 'intro', 'まえがき': 'intro', '場面': 'scene', '時': 'time', '見出し': 'head', '写真': 'photos', '本文': 'body', '区切り': 'divider', 'おわりに': 'ending', 'あとがき': 'ending', 'ひとこと': 'love', '署名': 'sign', '奥付': 'footer' };
function parseDiary(src){
  const d = { title: '', subtitle: '', date: '', mark: '', intro: '', items: [], ending: '', love: '', sign: '', footer: '' };
  let cur = null, field = null;
  const add = (o, k, v) => { o[k] = o[k] ? o[k] + '\n' + v : v; };
  const scene = () => { cur = { type: 'scene', time: '', head: '', photos: [], body: '' }; d.items.push(cur); };
  for (const line of String(src || '').replace(/\r/g, '').split('\n')){
    const mm = line.match(/^[\s\u3000]*【([^】]{1,8})】[\s\u3000]*(.*)$/);
    const key = mm ? D_KEYS[mm[1].replace(/[\s\u3000]/g, '')] : null;
    if (!key){ if (field) add(field.o, field.k, line); continue; }
    const v = mm[2];
    if (key === 'scene'){ scene(); field = null; continue; }
    if (key === 'divider'){ d.items.push({ type: 'divider' }); cur = null; field = null; continue; }
    if (key === 'time' || key === 'head' || key === 'photos' || key === 'body'){
      // 【場面】を書き忘れても、同じ見出しが二度出てきたら次の場面にする

    cur = null;
    d[key] = v; field = { o: d, k: key };

function quoteColor(name, writer){
  const n = String(name || '').trim();
  if (!n || /アリサ/.test(n)) return null;
  const o = S.personas.find(x => !isGroup(x) && nameVariants(x).some(v => v === n || (v.length >= 2 && n.includes(v))));
  if (!o) return '#9a7b6a';
  let k = diaryColorKey(o);
  if (writer && o.id !== writer.id && k === diaryColorKey(writer)) k = k === 'coral' ? 'mist' : 'coral';
  return DIARY_COLORS[k].ink;
}
// 本文：＞ではじまる行は本人の声、{名前|セリフ} はそのひとの色。改行はそのまま、空行は一行あける
function diaryInline(src, writer){
  const out = [];
  let gap = false;
  for (const l of String(src || '').split('\n')){
    if (!l.trim()){ gap = out.length > 0; continue; }
    const voice = /^[\s\u3000]*[＞>]/.test(l);
    let h = esc(voice ? l.replace(/^[\s\u3000]*[＞>][\s\u3000]*/, '') : l);
    h = h.replace(/[{｛]([^{}｛｝|｜\n]{1,20})[|｜]([^{}｛｝\n]*?)[}｝]/g, (m0, name, said) => { const col = quoteColor(name, writer); return col ? `<span class="q" style="color:${col}">${said}</span>` : said; });
    if (voice) h = `<span class="voice">${h}</span>`;
    out.push((gap ? '<br>' : '') + h);
    gap = false;
  }
  return out.join('<br>\n');
}
// 写真の並び：奇数枚なら最初の1枚を大きく、残りは2枚ずつ（見本と同じ）
function diaryPhotos(nums, srcs){
  const imgs = nums.map(n => srcs[n - 1]).filter(Boolean);
  const one = s => `<div class="entry-photo"><img src="${s}" alt=""></div>`;
  let h = '', i = 0;
  if (imgs.length % 2 === 1){ h += one(imgs[0]); i = 1; }
  for (; i < imgs.length; i += 2) h += `<div class="entry-photos-grid">${one(imgs[i])}${one(imgs[i + 1])}</div>`;
  return h;
}

function diaryFileName(d, w, days){

}
// 日記のHTMLを組み立てる。写真は日記に入れるときだけ小さくする（長い辺880px。見本と同じくらい）
async function buildDiaryFile(cid, i){
  const msgs = S.msgs[cid] || [], m = msgs[i];
  if (!m || !m.diary) throw new Error('no diary');
  const c = chat(cid), room = persona(c.personaId), w = (m.who && persona(m.who)) || room;
  // みんなの日記の色も覚えておく。色が変わっていたら作り直す（セリフの色も変わるので、全員分）
  const key = cid + ':' + m.ts + ':' + S.personas.filter(x => !isGroup(x)).map(x => x.id + '=' + diaryColorKey(x)).join(',');
  if (S._dcache && S._dcache.key === key) return S._dcache;
  const d = parseDiary(m.diary.src);
  const used = new Set(d.items.flatMap(x => x.photos || []));
  const byTs = new Map(msgs.map(x => [x.ts, x]));
  const refs = m.diary.photos || [], srcs = [];
  for (let n = 1; n <= refs.length; n++){
    const ref = refs[n - 1], src = byTs.get(ref.ts), a = src && src.att && src.att[ref.j];
    if (!used.has(n) || !a || a.kind !== 'image'){ srcs.push(null); continue; }
    try { srcs.push('data:image/jpeg;base64,' + await scaleB64(a.data, a.mime, 880, 0.8)); }
    catch(e){ srcs.push(`data:${a.mime};base64,${a.data}`); }
  }
  S._dcache = { key, html: diaryDoc(d, w, srcs), name: diaryFileName(d, w, m.diary.days), title: diaryTitle(d, w) };
  return S._dcache;
}

async function openDiaryView(cid, i){

  v.innerHTML = `<div class="dvtop"><button class="iconbtn" data-dv="close" aria-label="閉じる">${ICON.x}</button><span class="grow">${esc(f.title)}</span><button class="btn" data-dv="save">保存</button></div>
    <iframe class="dvframe" title="${esc(f.title)}" sandbox="allow-same-origin"></iframe>`;

  });

function downloadBlob(blob, name, msg){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 10000);
  if (msg) toast(msg);
}

async function removeChat(id){
  const c = chat(id);
  if (!c || (S.stream && S.stream.chatId === id)) return false;
  if (!confirm(`No.${c.no} のチャットを消します。元には戻せません。`)) return false;
  S.chats = S.chats.filter(x => x.id !== c.id);
  delete S.msgs[c.id];
  // 番号を詰める：残ったチャットを古い順に1から振り直す
  const p = persona(c.personaId);
  const rest = S.chats.filter(x => x.personaId === c.personaId).sort((a, b) => a.no - b.no);
  rest.forEach((x, i) => { x.no = i + 1; });
  if (p){ p.nextNo = rest.length + 1; await savePersonas(); }
  await DB.del('msgs:' + c.id); await saveChats();
  return true;
}

// 返事が書いたメモリを、逆にたどって戻す（取り消す・作り直す・書き直すで使う）。全部戻せたら true
function revertMemOps(p, ops){
  let mem = p.memory || '', ok = true;
  for (const op of [...ops].reverse()){
    if (op.type === 'add'){ const at = mem.lastIndexOf(op.text); if (at >= 0) mem = (mem.slice(0, at) + mem.slice(at + op.text.length)).replace(/\n{2,}/g, '\n').replace(/^\n|\n$/g, ''); else ok = false; }
    else if (op.type === 'replace'){ if (mem.includes(op.new)) mem = mem.replace(op.new, op.old); else ok = false; }
    else if (op.type === 'rewrite'){ if (mem === op.now) mem = op.prev; else ok = false; }
  }
  return { mem, ok };
}
// 消える返事が書いたメモリは、聞かずにそのまま戻す
async function revertRemoved(c, removed){
  let changed = false;
  for (const m of [...removed].reverse()){
    if (!m || m.role !== 'assistant' || !m.memOps || m.memUndone) continue;
    const p = persona(m.who || c.personaId);
    if (!p) continue;
    p.memory = revertMemOps(p, m.memOps).mem; changed = true;
  }
  if (changed) await savePersonas();
}

// 写真は送る前に小さくする（長いほうの辺を1568pxまで、JPEG）
function shrinkImage(file){
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const max = 1568, sc = Math.min(1, max / Math.max(img.width, img.height));
      const cv = document.createElement('canvas');
      cv.width = Math.round(img.width * sc); cv.height = Math.round(img.height * sc);
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      URL.revokeObjectURL(url);
      resolve({ kind: 'image', mime: 'image/jpeg', name: file.name, data: cv.toDataURL('image/jpeg', 0.85).split(',')[1] });
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('image')); };
    img.src = url;
  });
}
// 保存してある写真（base64）を、長い辺 max px の JPEG にする（日記で使う）。読めなければ失敗にする
function scaleB64(data, mime, max, q){
  return new Promise((resolve, reject) => {
    const img = new Image();
    const timer = setTimeout(() => reject(new Error('timeout')), 15000);
    img.onload = () => {
      clearTimeout(timer);
      const sc = Math.min(1, max / Math.max(img.width, img.height));
      const cv = document.createElement('canvas');
      cv.width = Math.max(1, Math.round(img.width * sc)); cv.height = Math.max(1, Math.round(img.height * sc));
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      resolve(cv.toDataURL('image/jpeg', q).split(',')[1]);
    };
    img.onerror = () => { clearTimeout(timer); reject(new Error('image')); };
    img.src = `data:${mime || 'image/jpeg'};base64,${data}`;
  });
}
// アイコン用：真ん中を正方形に切り抜いて、192pxに小さくする
function squareIcon(file){
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const side = Math.min(img.width, img.height), size = 192;
      const cv = document.createElement('canvas');
      cv.width = size; cv.height = size;
      cv.getContext('2d').drawImage(img, (img.width - side) / 2, (img.height - side) / 2, side, side, 0, 0, size, size);
      URL.revokeObjectURL(url);
      resolve(cv.toDataURL('image/jpeg', 0.85));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('image')); };
    img.src = url;
  });
}
function toBase64(file){
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(String(r.result).split(',')[1]);
    r.onerror = () => reject(r.error);
    r.readAsDataURL(file);
  });
}

/* ===== イベント ===== */
// 下から出てくる画面：上の部分を引っぱり上げると全画面、引き下げると小さく／閉じる
// 画面のどこを触っても引っぱれる。中身を読んでいる途中（上までスクロールしていない）なら、下に引いても閉じない
let sheetY = null, sheetTop = true;
app.addEventListener('touchstart', e => {
  if (e.target.closest && e.target.closest('#sheet')){
    sheetY = e.touches[0].clientY;
    const b = $('#sheet .sbody');
    sheetTop = !b || b.scrollTop <= 0 || !!e.target.closest('.grab, .shead');
  } else sheetY = null;
}, { passive: true });
app.addEventListener('touchmove', e => {
  if (sheetY == null || !S.ui.sheet) return;
  if (e.touches[0].clientY - sheetY > 0 && sheetTop && e.cancelable) e.preventDefault(); // 下に引いたときにページの再読み込みが始まらないように
}, { passive: false });
app.addEventListener('touchend', e => {
  if (sheetY == null || !S.ui.sheet) return;
  const dy = e.changedTouches[0].clientY - sheetY; sheetY = null;
  const el = $('#sheet');
  if (!el) return;
  if (dy < -30 && S.ui.sheet.type === 'think' && !S.ui.sheet.full){ S.ui.sheet.full = true; el.classList.add('full'); }
  else if (dy > 60 && sheetTop){
    if (S.ui.sheet.full){ S.ui.sheet.full = false; el.classList.remove('full'); }
    else { S.ui.sheet = null; render({ keepScroll: true }); }
  }
});
// 返事が終わったあとに入力欄を押したら、上に置いていたメッセージを解いて、いちばん新しいところを見せる
app.addEventListener('focusin', e => {
  if (e.target.id === 'input' && !S.ui.cfocus){ S.ui.cfocus = true; updateCompact(); }
});
app.addEventListener('focusout', e => {
  if (e.target.id !== 'input') return;
  // ボタンを押す前に形が変わってずれないよう、少し待ってから細くする
  setTimeout(() => {
    const a = document.activeElement;
    if (a && a.closest && a.closest('.cbox')) return;
    S.ui.cfocus = false; updateCompact();
  }, 250);
});
app.addEventListener('focusin', e => {
  if (e.target.id !== 'input' || S.stream || S.ui.anchor == null) return;
  S.ui.anchor = null;
  const box = $('#msgs');
  if (box){ layoutAnchor(false); box.scrollTop = box.scrollHeight; }

app.addEventListener('contextmenu', async e => {
  const t = e.target.closest('.thread');
  if (!t) return;
  e.preventDefault();
  if (await removeChat(t.dataset.id)) render();
});
app.addEventListener('change', e => {
  const k = e.target.dataset && e.target.dataset.change;
  if (k && changes[k]) changes[k](e.target, e);
});
app.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'input'){ S.ui.draft = t.value; autosize(t); }
  if (t.id === 'pInst'){ const c = $('#instCount'); if (c) c.textContent = t.value.length + '文字'; }
  if (t.id === 'pMem'){ const c = $('#memCount'); if (c) c.textContent = t.value.length + '文字'; }
  if (t.id === 'userPrefs'){ const c = $('#prefCount'); if (c) c.textContent = t.value.length + '文字'; }
  if (t.id === 'diaryNote' && S.ui.sheet) S.ui.sheet.note = t.value;
});

/* ===== はじまり ===== */
// アプリとしてインストールできるように（sw.js は何も保存しない）
if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' }).then(r => r.update()).catch(() => {});
(async () => {
  try {
    await load();
    history.replaceState(S.view, '');
    render();
  } catch (e){
    app.innerHTML = `<div class="pad"><div class="err">データを開けませんでした。ブラウザの設定で、このサイトの保存が止められていないか確かめてください。<div class="detail">${esc(e.message)}</div></div></div>`;
  }
})();
</script>
</body>
</html>
