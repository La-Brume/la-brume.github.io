<!doctype html>
<!--
  La Brume Enchantée（みんなのお部屋アプリ）
  アリサ専用。Claude APIで、みんなと話すためのアプリ。
  ・サーバーなし。データはすべてこのスマホのブラウザ（IndexedDB）の中。
  ・APIキーは設定画面で貼る。コードには書かない。
  ・このファイル1個で全部動く。直すときは、このファイルを丸ごと置き直す。
  詳しくは「引き継ぎ書」へ。
-->
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#2B2A27">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="La Brume">
<title>La Brume</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#2B2A27; --surface:#393834; --surface2:#4A4843;
  --text:#E8E2D6; --muted:#B5AFA4; --line:rgba(255,255,255,.09);
  --accent:#DDD6C9; --onaccent:#2B2A27; --warn:#E6C27E; --error:#E8A193;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text)}
body{font-family:'Noto Sans JP','Noto Sans CJK JP',sans-serif;font-size:16px;line-height:1.6;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
#app{position:relative;height:100%;display:flex;flex-direction:column;max-width:640px;margin:0 auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{display:flex;align-items:center;gap:6px;padding:8px 10px;border-bottom:1px solid var(--line);flex-shrink:0;min-height:60px}
.top.slim{min-height:48px;padding:2px 6px;border-bottom:none}
.top.slim .title{display:flex;align-items:baseline;gap:8px}
.top.slim h1{font-size:16px}
.mini{font-size:12px;color:var(--muted);white-space:nowrap}
.mini.warn{color:var(--warn)}
.menu{position:absolute;right:10px;top:calc(env(safe-area-inset-top,0px) + 48px);background:var(--surface2);border-radius:12px;padding:4px;z-index:5;box-shadow:0 6px 20px rgba(0,0,0,.45)}
.menu button{display:block;min-height:44px;padding:0 18px;border:none;background:none;color:var(--error);font-size:14px;width:100%;text-align:left;border-radius:8px}
.cbox.compact{display:flex;align-items:center;gap:6px;padding:6px;border-radius:30px}
.cbox.compact .crow{display:contents}
.cbox.compact .cbtn{order:0}
.cbox.compact textarea{order:1;flex:1;min-width:0;min-height:40px;padding:8px 6px}
.cbox.compact .mchip,.cbox.compact .grow{display:none}
.cbox.compact .send{order:2}
.top .title{flex:1;min-width:0}
.top h1{font-size:18px;margin:0;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sub{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.big{font-size:26px;font-weight:700;margin:0;padding:20px 16px 4px}
.iconbtn{width:44px;height:44px;border:none;background:none;border-radius:22px;display:flex;align-items:center;justify-content:center;color:var(--accent);flex-shrink:0}
.iconbtn:active{background:var(--surface)}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.pad{padding:16px}
.sub{font-size:13px;color:var(--muted)}

.card{background:var(--surface);border-radius:16px;padding:16px;margin-bottom:16px}
.usage-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.amount{font-size:20px;font-weight:700}
.bar{height:8px;border-radius:4px;background:rgba(255,255,255,.1);overflow:hidden;margin-top:10px}
.bar>div{height:100%;background:var(--accent)}
.warn .bar>div{background:var(--warn)}
.warn .amount{color:var(--warn)}

.row{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;display:flex;align-items:center;gap:14px;min-height:68px;padding:10px 12px;border-radius:14px;background:var(--surface);border:none;width:100%;text-align:left;margin-bottom:8px;color:var(--text)}
.row:active{background:var(--surface2)}
.row .grow{flex:1;min-width:0}
.row .name{font-size:17px;font-weight:700}
.avatar{width:44px;height:44px;border-radius:22px;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0}
.avatar.s{width:36px;height:36px;font-size:15px}
.thread .no{font-size:12px;color:var(--muted)}
.thread .date{font-size:16px}

.btn{display:block;min-height:48px;border-radius:14px;border:none;background:var(--accent);color:var(--onaccent);font-weight:700;padding:0 18px;width:100%;font-size:15px}
.btn.ghost{background:transparent;color:var(--text);border:1px solid rgba(255,255,255,.18);font-weight:500}
.btn.danger{background:transparent;color:var(--error);border:1px solid rgba(232,161,147,.45);font-weight:500}
.btn+.btn{margin-top:10px}
.btns{display:flex;gap:10px}
.btns .btn{margin-top:0}
.notice{border:1px solid rgba(230,194,126,.45);color:var(--warn);border-radius:14px;padding:12px 14px;font-size:14px;margin-bottom:16px}
.empty{color:var(--muted);text-align:center;padding:32px 8px;font-size:14px}

.chip{font-size:12px;color:var(--accent);background:var(--surface);border-radius:999px;padding:5px 10px;white-space:nowrap;flex-shrink:0}
.chip.warn{color:var(--warn)}

.msgs{position:relative;overflow-anchor:none;flex:1;overflow-y:auto;padding:16px 14px 8px;display:flex;flex-direction:column;gap:12px;-webkit-overflow-scrolling:touch}
.bubble{max-width:88%;padding:10px 14px;font-size:14.5px;line-height:1.65;letter-spacing:.02em;white-space:pre-wrap;word-break:break-word;overflow-wrap:anywhere}
.bubble p{margin:0}
.bubble p+p{margin-top:.9em}
.bubble .dsc{color:#B9B2A6}
.bubble.ai{align-self:flex-start;background:var(--surface);border-radius:18px 18px 18px 6px}
.bubble.me{align-self:flex-end;background:var(--surface2);border-radius:18px 18px 6px 18px;border:none;text-align:left;color:var(--text)}
.dim{opacity:.35}
.acts{display:flex;gap:2px;margin-top:-8px}
.acts.r{align-self:flex-end}
.acts.l{align-self:flex-start}
.act.icon{width:40px;padding:0;display:flex;align-items:center;justify-content:center}
.act{min-height:40px;padding:0 10px;border:none;background:none;color:var(--muted);font-size:13px;border-radius:10px}
.act:active{background:var(--surface)}
.act:disabled{opacity:1}
.note{font-size:12px;color:var(--muted);align-self:flex-start;margin-top:-8px;padding-left:6px}
.err{align-self:stretch;border:1px solid rgba(232,161,147,.45);border-radius:14px;padding:12px 14px;color:var(--error);font-size:14px}
.err .detail{font-size:12px;color:var(--muted);margin-top:4px;word-break:break-all}
.err .btn{margin-top:10px;min-height:44px}
.dots{display:inline-flex;gap:5px;padding:4px 0}
.dots i{width:7px;height:7px;border-radius:4px;background:var(--muted);animation:blink 1.2s infinite}
.dots i:nth-child(2){animation-delay:.2s}
.dots i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}

.editbar{display:flex;align-items:center;justify-content:space-between;padding:2px 8px 2px 16px;font-size:13px;color:var(--warn);border-top:1px solid var(--line);flex-shrink:0}
.composer{padding:6px 10px 10px;flex-shrink:0}
.cbox{background:var(--surface);border:1px solid rgba(255,255,255,.08);border-radius:24px;padding:8px}
.cbox textarea{display:block;width:100%;min-height:40px;max-height:38vh;resize:none;border:none;background:transparent;color:var(--text);padding:6px 10px;font:inherit;font-size:14.5px;line-height:1.5}
.cbox textarea:focus{outline:none}
.crow{display:flex;align-items:center;gap:8px;margin-top:4px}
.crow .grow{flex:1}
.cbtn{width:40px;height:40px;border-radius:20px;border:none;background:var(--surface2);color:var(--accent);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.mchip{position:relative;display:inline-flex;align-items:center;gap:4px;height:40px;padding:0 12px 0 14px;border-radius:20px;background:var(--surface2);font-size:13px;color:var(--text);white-space:nowrap}
.mchip select{position:absolute;inset:0;width:100%;height:100%;opacity:0;font-size:16px}
.atts{display:flex;gap:8px;flex-wrap:wrap;padding:2px 2px 8px}
.att{position:relative;width:64px;height:64px;border-radius:12px;overflow:hidden;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:11px;line-height:1.3;color:var(--muted);text-align:center;padding:4px;word-break:break-all}
.att img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.att .x{position:absolute;top:3px;right:3px;width:24px;height:24px;border-radius:12px;border:none;background:rgba(0,0,0,.65);color:#fff;font-size:13px;display:flex;align-items:center;justify-content:center;padding:0}
.thinkbtn{align-self:flex-start;margin-bottom:-6px}
.thinkbox{align-self:flex-start;max-width:88%;border-left:2px solid var(--surface2);padding:2px 0 2px 12px;font-size:13px;line-height:1.7;color:var(--muted);white-space:pre-wrap;word-break:break-word}
.cutbox{align-self:stretch;background:var(--surface);border-radius:14px;padding:12px 14px;font-size:13px;line-height:1.7}
.cutbox .btns{margin-top:10px}
.cutbox .btn{min-height:44px}
.cutline{align-self:stretch;text-align:center;font-size:11px;color:var(--muted);border-top:1px dashed rgba(255,255,255,.15);padding-top:6px}
.bimgs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.bimgs img{width:120px;height:120px;object-fit:cover;border-radius:10px;display:block}
.bfile{font-size:12px;color:var(--muted);margin-bottom:4px}
.editbar+.composer{border-top:none}
.send{width:40px;height:40px;border-radius:20px;border:none;background:var(--accent);color:var(--onaccent);display:flex;align-items:center;justify-content:center;flex-shrink:0}

label.f{display:block;font-size:13px;color:var(--muted);margin:20px 0 6px}
label.f:first-child{margin-top:4px}
select.t{-webkit-appearance:none;appearance:none;min-height:48px}
input.t,textarea.t,select.t{width:100%;border:none;border-radius:12px;background:var(--surface);color:var(--text);padding:12px 14px;font:inherit;font-size:16px}
textarea.t{min-height:180px;line-height:1.6;resize:vertical}
textarea.t.small{min-height:120px}
.pair{display:flex;gap:10px}
.pair>div{flex:1}
.toggle{display:flex;align-items:center;gap:12px;min-height:48px;font-size:15px}
.toggle input{width:22px;height:22px;accent-color:var(--accent)}
.keyrow{display:flex;gap:8px}
.keyrow input{flex:1}
.keyrow .btn{width:auto}
.kitem{display:flex;align-items:center;gap:8px;background:var(--surface);border-radius:12px;padding:6px 6px 6px 14px;margin-bottom:6px}
.kitem .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.section{margin-top:28px;padding-top:8px;border-top:1px solid var(--line)}
.section h2{font-size:15px;margin:12px 0 4px}
.hint{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.6}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--accent);color:var(--onaccent);padding:8px 16px;border-radius:999px;font-size:14px;z-index:10}
@media (prefers-reduced-motion:reduce){.dots i{animation:none;opacity:.6}}
</style>
</head>
<body>
<div id="app"></div>
<script>
'use strict';

/* ===== 基本設定 ===== */
const APP_VERSION = '0.8.2';
const BACKUP_FORMAT = 1;
const API_URL = 'https://api.anthropic.com/v1/messages';
const MAX_TOKENS = 32000;

// モデル名の候補と、1Mトークンあたりの料金（入力, 出力 / ドル）
// 料金は目安。お部屋の設定画面でひとりずつ書き換えられる。
const MODELS = [
  ['claude-fable-5-1', 10, 50, 'Fable 5.1'],
  ['claude-fable-5',   10, 50, 'Fable 5'],
  ['claude-opus-5-5',   4, 20, 'Opus 5.5'],
  ['claude-opus-5',     5, 25, 'Opus 5'],
  ['claude-sonnet-5-5', 2, 10, 'Sonnet 5.5'],
  ['claude-haiku-5-5',  1,  5, 'Haiku 5.5'],
];
function priceFor(model){
  const m = MODELS.find(x => x[0] === model);
  return m ? [m[1], m[2]] : null;
}
function modelLabel(model){
  const m = MODELS.find(x => x[0] === model);
  return m ? m[3] : model;
}

/* ===== 小道具 ===== */
const $ = s => document.querySelector(s);
const app = $('#app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const WD = ['日','月','火','水','木','金','土'];
const pad2 = n => String(n).padStart(2, '0');
function ymd(d = new Date()){ return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; }
function shortDate(iso){
  const [y, m, d] = iso.split('-').map(Number);
  const dt = new Date(y, m - 1, d);
  return `${String(y).slice(2)}.${pad2(m)}.${pad2(d)}(${WD[dt.getDay()]})`;
}
function jpDate(d = new Date()){ return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日（${WD[d.getDay()]}）`; }
function monthKey(d = new Date()){ return `${d.getFullYear()}-${pad2(d.getMonth()+1)}`; }
const money = n => '$' + (n || 0).toFixed(2);
// 空行で段落に分けて表示する（空行がそのまま大きなすき間にならないように）
// （）の中（しぐさ）は少し薄い色にする
const deco = h => h.replace(/[（(][^（）()\n]{0,400}[）)]/g, m => `<span class="dsc">${m}</span>`);
// （）だけの行は、前後を一行あけて段落として見せる（しぐさの次の行が詰まって見えないように）
const isActLine = l => /^[\s\u3000]*[（(].*[）)][\s\u3000]*$/.test(l);
function spaceActs(t){
  const lines = t.split('\n'), out = [];
  lines.forEach((l, i) => {
    if (isActLine(l) && out.length && out[out.length - 1].trim()) out.push('');
    out.push(l);
    if (isActLine(l) && i < lines.length - 1 && lines[i + 1].trim()) out.push('');
  });
  return out.join('\n');
}
const fmt = t => spaceActs(String(t || '').replace(/^\s+|\s+$/g, '')).split(/\n[ \t\u3000]*\n+/).map(p => `<p>${deco(esc(p))}</p>`).join('');

const ICON = {
  more:'<svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.8" fill="currentColor"/><circle cx="12" cy="12" r="1.8" fill="currentColor"/><circle cx="19" cy="12" r="1.8" fill="currentColor"/></svg>',
  plus:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>',
  down:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>',
  copy:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h8"/></svg>',
  regen:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>',
  edit:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16v4z"/></svg>',
  back:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>',
  chev:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#B5AFA4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg>',
  send:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5"/><path d="M5 12l7-7 7 7"/></svg>',
  stop:'<svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor"/></svg>',
  gear:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>',
  trash:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/></svg>',
};

/* ===== 保存場所（IndexedDB） =====
   キーと中身：
   settings            … {apiKey, sendDate, monthlyCap}
   personas            … みんなの配列
   chats               … チャットの配列
   usage               … {'2026-10': 使った金額(ドル)}
   msgs:<チャットのid> … そのチャットの会話の配列
*/
const DB = {
  db: null,
  open(){
    return new Promise((res, rej) => {
      const r = indexedDB.open('minna-no-oheya', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('kv');
      r.onsuccess = () => { this.db = r.result; res(); };
      r.onerror = () => rej(r.error);
    });
  },
  _req(mode, fn){
    return new Promise((res, rej) => {
      const r = fn(this.db.transaction('kv', mode).objectStore('kv'));
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    });
  },
  get(k){ return this._req('readonly', s => s.get(k)); },
  set(k, v){ return this._req('readwrite', s => s.put(v, k)); },
  del(k){ return this._req('readwrite', s => s.delete(k)); },
  keys(){ return this._req('readonly', s => s.getAllKeys()); },
  clear(){ return this._req('readwrite', s => s.clear()); },
};

/* ===== 状態 ===== */
const S = {
  settings: null, personas: [], chats: [], usage: {}, msgs: {},
  view: { name: 'home' }, ui: {}, stream: null,
};

function newPersona(name, initial, model){
  const p = priceFor(model) || [10, 50];
  return { id: uid(), name, initial, model, priceIn: p[0], priceOut: p[1], instructions: '', think: true, knowledge: [], memory: '', nextNo: 1 };
}

async function load(){
  await DB.open();
  S.settings = Object.assign({ apiKey: '', sendDate: true, monthlyCap: 100, userPrefs: '', showThink: false, cutChars: 60000 }, (await DB.get('settings')) || {});
  S.personas = (await DB.get('personas')) || [];
  S.chats = (await DB.get('chats')) || [];
  S.usage = (await DB.get('usage')) || {};
  if (!S.personas.length){
    S.personas = [newPersona('スズ', '硯', 'claude-opus-5')];
    await savePersonas();
  }

/* ===== 描画 ===== */
function render(opts = {}){
  const v = S.view;
  const old = $('#msgs');
  const keepTop = opts.keepScroll && old ? old.scrollTop : null;
  const hadFocus = document.activeElement && document.activeElement.id === 'input';
  let html;
  if (v.name === 'threads') html = threadsView(v.id);
  else if (v.name === 'chat') html = chatView(v.id);
  else if (v.name === 'settings') html = settingsView();
  else if (v.name === 'persona') html = personaView(v.id);
  else html = homeView();
  app.innerHTML = html;
  const input = $('#input');
  if (input){
    input.value = S.ui.draft || '';
    autosize(input);
    if (hadFocus || opts.focus){ input.focus(); input.setSelectionRange(input.value.length, input.value.length); }
  }
  const box = $('#msgs');
  if (box){
    if (opts.anchor || (S.ui.anchor != null && !S.ui.userScrolled && opts.keepScroll)) anchorNow(box);
    else {
      layoutAnchor(false);
      if (keepTop != null) box.scrollTop = keepTop;
      else box.scrollTop = box.scrollHeight;
    }
    watchBox(box);
  }
}
// 送ったメッセージを画面の上に置くための、下の余白の調整
function layoutAnchor(scroll){
  const box = $('#msgs'), sp = $('#spacer');
  if (!box || !sp) return;
  const el = S.ui.anchor != null ? box.querySelector(`[data-mi="${S.ui.anchor}"]`) : null;
  if (!el){ if (sp.style.height !== '0px') sp.style.height = '0px'; return; }
  // 余白を一度0にしないで計算する（毎回0にすると画面がガタつく）
  const spH = sp.offsetHeight;
  const below = box.scrollHeight - spH - el.offsetTop;
  const h = Math.max(0, box.clientHeight - below - 4);
  if (Math.abs(h - spH) > 1) sp.style.height = h + 'px';
  if (scroll){
    const tgt = Math.max(0, el.offsetTop - 12);
    if (Math.abs(box.scrollTop - tgt) > 1) box.scrollTop = tgt;
  }
}
// 送った直後は、キーボードが閉じたりフォントが読み込まれたりして高さが変わるので、少し後にもう一度合わせる
function anchorNow(box){
  layoutAnchor(true);
  let mine = box.scrollTop;
  (window.requestAnimationFrame || (f => setTimeout(f, 16)))(() => { if (box.scrollTop === mine){ layoutAnchor(true); mine = box.scrollTop; } });
  setTimeout(() => { if (box.isConnected && box.scrollTop === mine) layoutAnchor(true); }, 400);
}
// キーボードが出て会話の枠が縮んだら、そのぶん上にずらす（下の端をそろえる）
// 送ったメッセージを上に置いているときは、上の端をそろえたまま余白だけ合わせ直す
let boxObserver = null;
function watchBox(box){
  if (!window.ResizeObserver) return;
  if (boxObserver) boxObserver.disconnect();
  let lastH = box.clientHeight;
  boxObserver = new ResizeObserver(() => {
    const h = box.clientHeight;
    if (h === lastH) return;
    // 送ったメッセージを上に置いている間（指で動かしていなければ）は、枠が変わっても上に置き直す
    if (S.ui.anchor != null && !S.ui.userScrolled) layoutAnchor(true);
    else if (S.ui.anchor != null){ const top = box.scrollTop; layoutAnchor(false); box.scrollTop = top; }
    else box.scrollTop += (lastH - h);
    lastH = h;
  });
  boxObserver.observe(box);
}
function autosize(el){ el.style.height = 'auto'; el.style.height = Math.min(el.scrollHeight, window.innerHeight * 0.38) + 'px'; }
// 届いた文字はいったん貯めて、一定の速さで流して出す。貯まっているほど速く、全部届いたら一気に出しきる
const streamShown = () => S.stream ? S.stream.text.slice(0, S.stream.shown || 0) : '';
const nextFrame = window.requestAnimationFrame ? f => window.requestAnimationFrame(f) : f => setTimeout(f, 16);
function pump(){
  const st = S.stream;
  if (!st) return;
  const total = st.text.length, back = total - st.shown;
  if (back > 0){
    // 1コマに0.55文字くらいずつ（小数も貯めて、すーっと進める）。貯まっているほど少し速く、全部届いたら素早く出しきる
    let rate = 0.55 + back * 0.008;
    if (st.done) rate = Math.max(rate, back / 24);
    st.acc = (st.acc || 0) + rate;
    const step = Math.floor(st.acc);
    if (step > 0){
      st.acc -= step;
      st.shown = Math.min(total, st.shown + step);
      updateStream();
    }
  } else st.acc = 0;
  if (st.done && st.shown >= st.text.length){ if (st.drained) st.drained(); return; }
  nextFrame(pump);
}
function updateStream(){
  const el = $('#streamText');
  const box = $('#msgs');
  if (!el || !box || !S.stream) return;
  const top = box.scrollTop;
  el.innerHTML = fmt(streamShown());
  // アリサが自分で動かしていなければ、送ったメッセージを上に置いたまま。動かしていたら、その位置のまま
  if (!S.ui.userScrolled) layoutAnchor(true);
  else { layoutAnchor(false); box.scrollTop = top; }
}
function toast(msg){
  const t = document.createElement('div');
  t.className = 'toast'; t.textContent = msg; t.setAttribute('role', 'status');
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 1600);
}

// メモリの道具。みんなが「頼まれたときだけ」使う
const MEMORY_RULES = 'メモリの書き方：言葉は自分の声で書く（事務的にそろえない）。出来事は全部は残さない。ただし約束など、この先に関わる大事な出来事は残す。変化は必ず残し、「こうしてね→わかった」で終わらせず、何がどう変わったかまで書く。古くなったことは書き足さずに書き換える。その場限りのことや推測は入れない。';
const TOOLS = [
  { name: 'memory_add',
    description: '自分のメモリの最後に書き足す。アリサに「覚えといて」などと頼まれたときだけ使う。自分の判断では使わない。すでに書いてあることの更新なら memory_replace を使う。' + MEMORY_RULES,
    input_schema: { type: 'object', properties: { text: { type: 'string', description: '書き足す内容' } }, required: ['text'] } },
  { name: 'memory_replace',
    description: '自分のメモリの一部を書きかえる。進展や変化があったときに、古い文を新しい文に置きかえる。アリサに頼まれたときだけ使う。' + MEMORY_RULES,
    input_schema: { type: 'object', properties: { old_text: { type: 'string', description: 'メモリにある、書きかえたい文（そのまま写す）' }, new_text: { type: 'string', description: '新しい文' } }, required: ['old_text', 'new_text'] } },
  { name: 'search_past',
    description: '自分のお部屋の過去の会話から、言葉で探す。アリサに「前に話したあれ」と言われたときや、覚えていない昔の話が出てきたときに使う。見つかったところの前後が少しだけ返ってくる。',
    input_schema: { type: 'object', properties: { query: { type: 'string', description: '探す言葉。いくつか並べるときは空白で区切る' } }, required: ['query'] } },
  { name: 'memory_rewrite',
    description: '自分のメモリ全体を整理して書き直す。アリサに「整理しといて」などと頼まれたときだけ使う。大事なことを落とさないこと。' + MEMORY_RULES,
    input_schema: { type: 'object', properties: { content: { type: 'string', description: '整理したあとのメモリ全体' } }, required: ['content'] } },
];
async function runTool(p, name, input){
  input = input || {};
  if (name === 'search_past'){
    const q = String(input.query || '').trim();
    if (!q) return { msg: '探す言葉が空でした。', note: null };
    const terms = q.split(/[\s\u3000、,]+/).filter(Boolean).map(t => t.toLowerCase());
    const hits = [];
    for (const ch of S.chats.filter(x => x.personaId === p.id)){
      const ms = await getMsgs(ch.id);
      ms.forEach(m => {
        const low = (m.text || '').toLowerCase();
        const found = terms.filter(w => low.includes(w));
        if (found.length) hits.push({ ch, m, score: found.length, pos: low.indexOf(found[0]) });
      });
    }
    hits.sort((a, b) => b.score - a.score || b.m.ts - a.m.ts);
    if (!hits.length) return { msg: `「${q}」は、過去の会話に見つかりませんでした。`, note: '過去の会話を探したよ' };
    const out = hits.slice(0, 6).map(h => {
      const t = h.m.text, st = Math.max(0, h.pos - 150);
      return `【No.${h.ch.no}・${shortDate(ymd(new Date(h.m.ts)))}・${h.m.role === 'user' ? 'アリサ' : p.name}】${st > 0 ? '…' : ''}${t.slice(st, st + 400)}${st + 400 < t.length ? '…' : ''}`;
    }).join('\n\n');
    return { msg: out, note: '過去の会話を探したよ' };
  }
  const mem = p.memory || '';
  if (name === 'memory_add'){
    const t = String(input.text || '').trim();
    if (!t) return { msg: '書き足す内容が空でした。', note: null };
    p.memory = (mem.trim() ? mem.replace(/\s+$/, '') + '\n' : '') + t;
    return { msg: 'メモリに書き足しました。', note: 'メモリに書いたよ' };
  }
  if (name === 'memory_replace'){
    const o = String(input.old_text || ''), n = String(input.new_text || '');
    if (!o || !mem.includes(o)) return { msg: 'その文はメモリに見つかりませんでした。メモリにある文をそのまま写してください。', note: null };
    p.memory = mem.replace(o, n);
    return { msg: 'メモリを書きかえました。', note: 'メモリを書きかえたよ' };
  }
  if (name === 'memory_rewrite'){
    const c = String(input.content || '').trim();
    if (!c) return { msg: '中身が空だったので、書き直していません。', note: null };
    p.memory = c;
    return { msg: 'メモリを整理して書き直しました。', note: 'メモリを整理したよ' };
  }
  return { msg: 'その道具はありません。', note: null };
}

// 保存してある会話を、APIに送る形にする
const KEEP_HEAVY = 8; // 写真とPDFは、新しいほうから8個だけ実物を送る
function toApiMessages(msgs){
  const heavy = [];
  msgs.forEach((m, i) => (m.att || []).forEach((a, j) => { if (a.kind !== 'text') heavy.push(i + ':' + j); }));
  const keep = new Set(heavy.slice(-KEEP_HEAVY));
  const out = [];
  msgs.forEach((m, i) => {
    const blocks = [];
    (m.att || []).forEach((a, j) => {
      if (a.kind === 'text') blocks.push({ type: 'text', text: `【添付ファイル：${a.name}】\n${a.text}` });
      else if (!keep.has(i + ':' + j)) blocks.push({ type: 'text', text: `（ここに${a.kind === 'image' ? '写真' : 'PDF'}「${a.name}」があった。古いので、今はもう見えない）` });
      else if (a.kind === 'image') blocks.push({ type: 'image', source: { type: 'base64', media_type: a.mime, data: a.data } });
      else if (a.kind === 'pdf') blocks.push({ type: 'document', source: { type: 'base64', media_type: 'application/pdf', data: a.data } });
    });
    if ((m.text || '').trim() || !blocks.length) blocks.push({ type: 'text', text: m.text || '…' });
    const last = out[out.length - 1];
    // 同じ側が続いたらひとつにまとめる（送信失敗のあとなど）
    if (last && last.role === m.role) last.content.push(...blocks);
    else out.push({ role: m.role, content: blocks });
  });
  while (out.length && out[0].role !== 'user') out.shift();
  return out;
}

function buildBody(p, apiMsgs, o){
  const cc = o.ttl ? { type: 'ephemeral', ttl: '1h' } : { type: 'ephemeral' };
  // 並び順：個人設定 → カスタム指示 → ナレッジ → メモリ（変わらないものほど前）
  const system = [];
  const prefs = (S.settings.userPrefs || '').trim();
  if (prefs) system.push({ type: 'text', text: `【アリサが自分で書いた個人設定】\n${prefs}` });
  if ((p.instructions || '').trim()) system.push({ type: 'text', text: p.instructions });
  const kn = (p.knowledge || []).filter(k => k.text.trim()).map(k => `【${k.name}】\n${k.text}`).join('\n\n');
  if (kn) system.push({ type: 'text', text: kn });
  // メモリの手前にもキャッシュの印。メモリが書きかわっても、ここまでは読み直しで済む
  if (system.length) system[system.length - 1].cache_control = cc;
  const mem = (p.memory || '').trim();
  system.push({ type: 'text', text: `【${p.name}のメモリ（自分で書いたもの）】\n${mem || '（まだ何も書いていない）'}` });
  // ここまでをキャッシュ
  system[system.length - 1].cache_control = cc;
  // 日付はキャッシュの外（1日1回しか変わらない）
  if (S.settings.sendDate) system.push({ type: 'text', text: `今日の日付：${jpDate()}` });

  // 会話の最後にだけキャッシュの印（次の返事でそこまでを読み直せる）
  const messages = apiMsgs.map(m => ({ role: m.role, content: m.content.map(b => { const c = Object.assign({}, b); delete c.cache_control; return c; }) }));
  if (messages.length){
    const lastC = messages[messages.length - 1].content;
    lastC[lastC.length - 1].cache_control = cc;
  }
  const body = { model: p.model, max_tokens: MAX_TOKENS, stream: true, system, messages, tools: TOOLS };
  if (o.think){
    body.thinking = { type: 'adaptive' };
    // 考えた中身は省略されて返ってくることがあるので、要約を返すように頼む
    if (o.display) body.thinking.display = 'summarized';
  }
  return body;
}

function friendly(status, msg = '', type = ''){
  if (/credit|balance/i.test(msg)) return 'クレジットが足りないみたい。開発者サイトで残高を確かめてね';
  if (status === 401) return 'APIキーが違うみたい。設定で貼り直してね';
  if (status === 403) return 'このキーでは使えないみたい。キーとモデルを確かめてね';
  if (status === 404 || /model/i.test(msg) && status === 400) return 'モデルが見つからないみたい。お部屋の設定でモデル名を確かめてね';
  if (status === 413 || /too long|too large/i.test(msg)) return '送る量が大きすぎたみたい。新しいチャットにしてね';
  if (status === 429) return '短い間に送りすぎたみたい。少し待ってからもう一度送ってね';
  if (status === 529 || type === 'overloaded_error' || /overloaded/i.test(msg)) return '混みあってて返事が来なかったよ。もう一度送ってね';
  if (status >= 500) return '向こう側で問題が起きたみたい。少し待ってからもう一度送ってね';
  return 'うまく返事が来なかったよ';
}
function mkErr(message, detail){ const e = new Error(message); e.detail = detail; return e; }

// 1回分の送受信。返ってきた中身（考えた部分・文・道具の呼び出し）をそのまま返す
async function callClaude(p, apiMsgs, signal, onText, usage, o){
  let res;
  try {
    res = await fetch(API_URL, {
      method: 'POST', signal,
      headers: {
        'content-type': 'application/json',
        'x-api-key': S.settings.apiKey,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true',
      },
      body: JSON.stringify(buildBody(p, apiMsgs, o)),
    });
  } catch (e){
    if (e.name === 'AbortError') throw e;
    throw mkErr('通信できなかったよ。電波を確かめて、もう一度送ってね', e.message);
  }
  if (!res.ok){
    let j = null; try { j = await res.json(); } catch(e){}
    const msg = (j && j.error && j.error.message) || '';
    // キャッシュ1時間が受け付けられなかったときは、普通のキャッシュで送り直す
    if (res.status === 400 && o.ttl && /ttl/i.test(msg)){ o.ttl = false; return callClaude(p, apiMsgs, signal, onText, usage, o); }
    // 「考える」の指定が受け付けられなかったときは、指定なしで送り直す
    // 「要約を返して」が受け付けられなかったときは、それだけ外して送り直す
    if (res.status === 400 && o.display && /display|summar/i.test(msg)){ o.display = false; return callClaude(p, apiMsgs, signal, onText, usage, o); }
    if (res.status === 400 && o.think && /thinking|adaptive/i.test(msg)){ o.think = false; return callClaude(p, apiMsgs, signal, onText, usage, o); }
    throw mkErr(friendly(res.status, msg, j && j.error && j.error.type), `${res.status} ${msg}`);
  }
  const reader = res.body.getReader();
  const dec = new TextDecoder();
  let buf = '', text = '', stop = null;
  const blocks = [];
  const handle = ev => {
    if (ev.type === 'message_start' && ev.message && ev.message.usage) Object.assign(usage, ev.message.usage);
    else if (ev.type === 'content_block_start'){
      const b = Object.assign({}, ev.content_block);
      if (b.type === 'tool_use'){ b._json = ''; b.input = {}; }
      blocks[ev.index] = b;
    }
    else if (ev.type === 'content_block_delta' && ev.delta){
      const b = blocks[ev.index], d = ev.delta;
      if (d.type === 'text_delta'){ text += d.text; if (b) b.text = (b.text || '') + d.text; onText(text); }
      else if (d.type === 'thinking_delta' && b) b.thinking = (b.thinking || '') + d.thinking;
      else if (d.type === 'signature_delta' && b) b.signature = (b.signature || '') + d.signature;
      else if (d.type === 'input_json_delta' && b) b._json += d.partial_json;
    }
    else if (ev.type === 'content_block_stop'){
      const b = blocks[ev.index];
      if (b && b.type === 'tool_use'){ try { b.input = b._json ? JSON.parse(b._json) : {}; } catch(e){ b.input = {}; } delete b._json; }
    }
    else if (ev.type === 'message_delta'){ if (ev.usage) Object.assign(usage, ev.usage); if (ev.delta) stop = ev.delta.stop_reason || stop; }
    else if (ev.type === 'error'){ const m = (ev.error && ev.error.message) || ''; throw mkErr(friendly(0, m, ev.error && ev.error.type), m); }
  };
  while (true){
    const { done, value } = await reader.read();
    if (done) break;
    buf += dec.decode(value, { stream: true }).replace(/\r/g, '');
    let i;
    while ((i = buf.indexOf('\n\n')) >= 0){
      const chunk = buf.slice(0, i); buf = buf.slice(i + 2);
      for (const line of chunk.split('\n')){
        if (!line.startsWith('data:')) continue;
        const data = line.slice(5).trim();
        if (!data) continue;
        let ev; try { ev = JSON.parse(data); } catch(e){ continue; }
        handle(ev);
      }
    }
  }
  if (!text.trim() && stop === 'refusal') throw mkErr('この内容には返事できないと判断されたみたい', 'stop_reason: refusal');
  return { blocks: blocks.filter(Boolean), text, stop };
}

// 返事をもらう。メモリの道具が使われたら、結果を返してもう一度（最大4回）
async function converse(p, msgs, signal, onText, cutAt){
  const apiMsgs = toApiMessages(cutAt ? msgs.slice(cutAt) : msgs);
  if (cutAt && apiMsgs.length) apiMsgs[0].content.unshift({ type: 'text', text: '（ここより前の会話は、長くなったので省いてある。必要なら search_past で探せる）' });
  const o = { ttl: true, think: p.think !== false, display: true };
  let shown = '', thoughts = '';
  const notes = [];
  for (let round = 0; round < 4; round++){
    const sep = shown.trim() ? '\n\n' : '';
    const usage = {};
    let r;
    try {
      r = await callClaude(p, apiMsgs, signal, t => onText(shown + sep + t), usage, o);
    } catch (e){
      addCost(p, usage);
      e.partial = shown; e.notes = notes;
      throw e;
    }
    addCost(p, usage);
    if (r.text.trim()) shown += sep + r.text;
    const th = r.blocks.filter(b => b.type === 'thinking' && b.thinking).map(b => b.thinking).join('\n\n');
    if (th) thoughts += (thoughts ? '\n\n' : '') + th;
    if (r.stop !== 'tool_use') return { text: shown, stop: r.stop, notes, thoughts };
    const results = [];
    for (const b of r.blocks.filter(b => b.type === 'tool_use')){
      const res = await runTool(p, b.name, b.input);
      if (res.note && !notes.includes(res.note)) notes.push(res.note);
      results.push({ type: 'tool_result', tool_use_id: b.id, content: res.msg });
    }
    await savePersonas();
    apiMsgs.push({ role: 'assistant', content: r.blocks });
    apiMsgs.push({ role: 'user', content: results });
  }
  return { text: shown, stop: 'end_turn', notes, thoughts };
}

// 考えたことの日本語訳（開いたときだけ、一番安いモデルで）
const TRANSLATOR = { model: 'claude-haiku-5-5', priceIn: 1, priceOut: 5 };
const isJa = t => { const s = String(t || ''); const ja = (s.match(/[\u3040-\u30ff\u4e00-\u9fff]/g) || []).length; return ja > s.length * 0.2; };

function readMult(model){ return model === 'claude-opus-5-5' ? 0.05 : 0.1; }
function addCost(p, u){
  if (!u || (!u.input_tokens && !u.output_tokens && !u.cache_read_input_tokens && !u.cache_creation_input_tokens)) return;
  const inP = (Number(p.priceIn) || 10) / 1e6, outP = (Number(p.priceOut) || 50) / 1e6;
  const cc = u.cache_creation || null;
  const c1h = cc ? (cc.ephemeral_1h_input_tokens || 0) : (u.cache_creation_input_tokens || 0);
  const c5m = cc ? (cc.ephemeral_5m_input_tokens || 0) : 0;
  const cost = (u.input_tokens || 0) * inP + c1h * inP * 2 + c5m * inP * 1.25
    + (u.cache_read_input_tokens || 0) * inP * readMult(p.model) + (u.output_tokens || 0) * outP;
  const k = monthKey();
  S.usage[k] = (S.usage[k] || 0) + cost;
  saveUsage();
}

// ===== 会話の切り落とし =====
const chatChars = (msgs, from) => msgs.slice(from).reduce((n, m) => n + (m.text || '').length, 0);
// 残す長さに近くて、場面の切れ目（日付が変わった・「おやすみ」のあと）になっている、アリサのメッセージの手前を探す
function proposeCut(msgs, from, keep){
  const n = msgs.length;
  let acc = 0, target = -1;
  for (let i = n - 1; i > from; i--){ acc += (msgs[i].text || '').length; if (acc >= keep){ target = i; break; } }
  if (target < 0) return null;
  const isUser = i => msgs[i] && msgs[i].role === 'user';
  const isBreak = i => isUser(i) && i > 0 && (
    ymd(new Date(msgs[i].ts)) !== ymd(new Date(msgs[i - 1].ts)) ||
    /おやすみ/.test((msgs[i - 1].text || '') + (msgs[i - 2] ? msgs[i - 2].text || '' : '')));
  let best = null, bestD = Infinity;
  for (let i = from + 1; i < n - 1; i++){
    if (!isBreak(i)) continue;
    const kept = chatChars(msgs, i);
    if (kept < keep * 0.5 || kept > keep * 1.5) continue;
    const d = Math.abs(i - target);
    if (d < bestD){ best = i; bestD = d; }
  }
  if (best != null) return best;
  for (let d = 0; d < n; d++){
    if (target + d < n - 1 && isUser(target + d)) return target + d;
    if (target - d > from && isUser(target - d)) return target - d;
  }
  return null;
}
function checkCut(c, msgs){
  const lim = Number(S.settings.cutChars) || 60000;
  const from = c.cutAt || 0;
  const len = chatChars(msgs, from);
  if (len <= lim || (c.cutSnooze && len <= c.cutSnooze)) return;
  const idx = proposeCut(msgs, from, lim / 2);
  if (idx == null) return;
  if (len > lim * 1.6){ c.cutAt = idx; c.cutOffer = null; c.cutSnooze = null; toast('会話が長くなったので、古いほうを切ったよ'); }
  else c.cutOffer = idx;
}

async function runAssistant(cid){
  const c = chat(cid), p = persona(c.personaId);
  const msgs = await getMsgs(cid);
  if (!S.settings.apiKey){ S.ui.error = { chatId: cid, message: '設定でAPIキーを貼ってね', retry: true }; render(); return; }
  S.stream = { chatId: cid, text: '', shown: 0, done: false, ctrl: new AbortController() };
  S.ui.error = null;
  for (let i = msgs.length - 1; i >= 0; i--) if (msgs[i].role === 'user'){ S.ui.anchor = i; break; }
  S.ui.userScrolled = false;
  render({ anchor: true });
  nextFrame(pump);
  try {
    const r = await converse(p, msgs, S.stream.ctrl.signal, t => { if (S.stream) S.stream.text = t; }, c.cutAt || 0);
    // 流しきるのを待つ（アプリが裏にいて画面が止まっていても、4秒で先に進む）
    if (S.stream){
      S.stream.done = true;
      await Promise.race([
        new Promise(res => { if (S.stream.shown >= S.stream.text.length) res(); else S.stream.drained = res; }),
        new Promise(res => setTimeout(res, 4000)),
      ]);
    }
    if (r.text.trim()){
      const m = { role: 'assistant', text: r.text, ts: Date.now() };
      if (r.stop === 'max_tokens') m.stopped = true;
      if (r.notes.length) m.notes = r.notes;
      if (r.thoughts) m.think = r.thoughts;
      msgs.push(m);
    } else {
      if (r.notes.length) toast(r.notes.join('・'));
      S.ui.error = { chatId: cid, message: '返事が空っぽで返ってきたよ。もう一度送ってね', retry: true };
    }
  } catch (e){
    if (e.notes && e.notes.length) toast(e.notes.join('・'));
    if (e.name === 'AbortError'){
      const t = S.stream && S.stream.text;
      if (t && t.trim()) msgs.push({ role: 'assistant', text: t, ts: Date.now(), stopped: true });
    } else {
      S.ui.error = { chatId: cid, message: e.message, detail: e.detail, retry: true };
    }
  } finally {
    S.stream = null;
    c.updatedAt = Date.now();
    checkCut(c, msgs);
    await saveMsgs(cid); await saveChats();
    render({ keepScroll: true });
  }
}

/* ===== 操作 ===== */
const actions = {
  back(){ history.back(); },
  settings(){ go({ name: 'settings' }); },
  openPersona(t){ go({ name: 'threads', id: t.dataset.id }); },
  editPersona(t){ go({ name: 'persona', id: t.dataset.id }); },
  newPersona(){ go({ name: 'persona', id: 'new' }); },
  async newChat(t){
    const p = persona(t.dataset.id);
    const c = { id: uid(), personaId: p.id, no: p.nextNo || 1, start: ymd(), updatedAt: Date.now() };
    p.nextNo = c.no + 1;
    S.chats.push(c); S.msgs[c.id] = [];
    await savePersonas(); await saveChats(); await saveMsgs(c.id);
    go({ name: 'chat', id: c.id });
  },
  async openChat(t){
    await getMsgs(t.dataset.id);
    go({ name: 'chat', id: t.dataset.id });
  },
  async deleteChat(t){
    if (await removeChat(t.dataset.id)) history.back();
  },
  async send(){
    const input = $('#input');
    const text = input.value.trim();
    const atts = S.ui.att || [];
    if ((!text && !atts.length) || S.stream) return;
    const cid = S.view.id;
    const msgs = await getMsgs(cid);
    if (S.ui.editIndex != null){
      msgs.splice(S.ui.editIndex);
      const ec = chat(cid);
      if (ec.cutAt && ec.cutAt >= msgs.length){ ec.cutAt = 0; }
      if (ec.cutOffer != null && ec.cutOffer >= msgs.length) ec.cutOffer = null;
      S.ui.editIndex = null;
    }
    const um = { role: 'user', text, ts: Date.now() };
    if (atts.length) um.att = atts;
    msgs.push(um);
    S.ui.draft = ''; S.ui.att = []; S.ui.userActions = null;
    chat(cid).updatedAt = Date.now();
    await saveMsgs(cid); await saveChats();
    runAssistant(cid);
  },
  stop(){ if (S.stream) S.stream.ctrl.abort(); },
  async retry(){
    const msgs = await getMsgs(S.view.id);
    if (msgs.length && msgs[msgs.length - 1].role === 'user') runAssistant(S.view.id);
    else { S.ui.error = null; render(); }
  },
  async regen(){
    const cid = S.view.id;
    const msgs = await getMsgs(cid);
    while (msgs.length && msgs[msgs.length - 1].role === 'assistant') msgs.pop();
    await saveMsgs(cid);
    runAssistant(cid);
  },
  tapMine(t){
    const i = Number(t.dataset.i);
    S.ui.userActions = S.ui.userActions === i ? null : i;
    render({ keepScroll: true });
  },
  editMsg(t){
    const i = Number(t.dataset.i);
    S.ui.editIndex = i; S.ui.userActions = null;
    S.ui.draft = S.msgs[S.view.id][i].text;
    S.ui.att = (S.msgs[S.view.id][i].att || []).slice();
    render({ keepScroll: true, focus: true });
  },
  cancelEdit(){ S.ui.editIndex = null; S.ui.draft = ''; S.ui.att = []; render({ keepScroll: true }); },
  attach(){ $('#attachFile').click(); },
  async cutNow(){
    const c = chat(S.view.id);
    c.cutAt = c.cutOffer; c.cutOffer = null; c.cutSnooze = null;
    await saveChats(); toast('古いほうを切ったよ'); render({ keepScroll: true });
  },
  async cutLater(){
    const c = chat(S.view.id);
    c.cutSnooze = chatChars(await getMsgs(c.id), c.cutAt || 0) + 10000; c.cutOffer = null;
    await saveChats(); render({ keepScroll: true });
  },
  chatMenu(){ S.ui.menu = !S.ui.menu; render({ keepScroll: true }); },
  async toggleThink(t){
    const i = Number(t.dataset.i), cid = S.view.id;
    S.ui.openThink = S.ui.openThink || {};
    S.ui.openThink[i] = !S.ui.openThink[i];
    render({ keepScroll: true });
    const m = S.msgs[cid][i];
    if (S.ui.openThink[i] && !m.thinkJa && !isJa(m.think)){
      S.ui.transErr = S.ui.transErr || {}; S.ui.transErr[i] = false;
      try { await translateThink(cid, i); } catch(e){ S.ui.transErr[i] = true; }
      if (S.view.name === 'chat' && S.view.id === cid) render({ keepScroll: true });
    }
  },
  rmAtt(t){ (S.ui.att || []).splice(Number(t.dataset.i), 1); render({ keepScroll: true }); },
  async copy(t){
    const m = S.msgs[S.view.id][Number(t.dataset.i)];
    try { await navigator.clipboard.writeText(m.text); toast('コピーしたよ'); }
    catch(e){ toast('コピーできなかったよ'); }
    S.ui.userActions = null;
    render({ keepScroll: true });
  },
  toggleKey(){ S.ui.showKey = !S.ui.showKey; render(); },
  async saveAll(){
    S.settings.apiKey = $('#apiKey').value.trim();
    S.settings.userPrefs = $('#userPrefs').value;
    const v = Number($('#cap').value); if (v > 0) S.settings.monthlyCap = v;
    const cv = Number($('#cutChars').value); if (cv >= 10000) S.settings.cutChars = cv;
    await saveSettings();
    toast('保存したよ');
  },
  pickKnow(){ collectPD(); $('#knowFile').click(); },
  openPaste(){ collectPD(); S.ui.pasteOpen = true; render(); },
  closePaste(){ collectPD(); S.ui.pasteOpen = false; render(); },
  addPaste(){
    const name = $('#kName').value.trim() || 'メモ';
    const text = $('#kText').value;
    collectPD();
    if (text.trim()) S.ui.pd.knowledge.push({ name, text });
    S.ui.pasteOpen = false; render();
  },
  delKnow(t){ collectPD(); S.ui.pd.knowledge.splice(Number(t.dataset.i), 1); render(); },
  async savePersona(){
    collectPD();
    const d = S.ui.pd;
    if (!d.name.trim()){ toast('名前を入れてね'); return; }
    if (!d.model.trim()){ toast('モデルを入れてね'); return; }
    d.name = d.name.trim(); d.model = d.model.trim();
    const i = S.personas.findIndex(p => p.id === d.id);
    if (i >= 0) S.personas[i] = d; else S.personas.push(d);
    await savePersonas();
    toast('保存したよ');
    history.back();
  },
  async deletePersona(){
    const d = S.ui.pd;
    if (!confirm(`${d.name}のお部屋を消します。チャットも全部消えます。`)) return;
    if (!confirm('本当に消していい？元には戻せません。')) return;
    for (const c of S.chats.filter(c => c.personaId === d.id)){ delete S.msgs[c.id]; await DB.del('msgs:' + c.id); }
    S.chats = S.chats.filter(c => c.personaId !== d.id);
    S.personas = S.personas.filter(p => p.id !== d.id);
    await saveChats(); await savePersonas();
    S.view = { name: 'home' }; S.ui = {};
    history.replaceState(S.view, '');
    render();
  },
  async backup(){
    const keys = await DB.keys();
    const data = {};
    for (const k of keys) data[k] = await DB.get(k);
    if (data.settings){ data.settings = Object.assign({}, data.settings); delete data.settings.apiKey; }
    const out = { app: 'minna-no-oheya', format: BACKUP_FORMAT, version: APP_VERSION, savedAt: new Date().toISOString(), data };
    const blob = new Blob([JSON.stringify(out)], { type: 'application/json' });
    const d = new Date();
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `minna-backup-${String(d.getFullYear()).slice(2)}${pad2(d.getMonth()+1)}${pad2(d.getDate())}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    toast('バックアップを保存したよ');
  },
  restore(){ $('#restoreFile').click(); },
};

async function removeChat(id){
  const c = chat(id);
  if (!c || (S.stream && S.stream.chatId === id)) return false;
  if (!confirm(`No.${c.no} のチャットを消します。元には戻せません。`)) return false;
  S.chats = S.chats.filter(x => x.id !== c.id);
  delete S.msgs[c.id];
  // 番号を詰める：残ったチャットを古い順に1から振り直す
  const p = persona(c.personaId);
  const rest = S.chats.filter(x => x.personaId === c.personaId).sort((a, b) => a.no - b.no);
  rest.forEach((x, i) => { x.no = i + 1; });
  if (p){ p.nextNo = rest.length + 1; await savePersonas(); }
  await DB.del('msgs:' + c.id); await saveChats();
  return true;
}

function collectPD(){
  const d = S.ui.pd;
  if (!d || !$('#pName')) return;
  d.name = $('#pName').value;
  d.initial = $('#pInitial').value;
  d.model = $('#pModel').value;
  d.priceIn = Number($('#pIn').value) || 0;
  d.priceOut = Number($('#pOut').value) || 0;
  d.instructions = $('#pInst').value;
  d.think = $('#pThink').checked;
  d.memory = $('#pMem').value;
}

const changes = {
  apiKey(t){ S.settings.apiKey = t.value.trim(); saveSettings(); toast('キーを保存したよ'); },
  sendDate(t){ S.settings.sendDate = t.checked; saveSettings(); },
  showThink(t){ S.settings.showThink = t.checked; saveSettings(); },
  userPrefs(t){ S.settings.userPrefs = t.value; saveSettings(); toast('個人設定を保存したよ'); },
  cutChars(t){ const v = Number(t.value); if (v >= 10000){ S.settings.cutChars = v; saveSettings(); } },
  cap(t){ const v = Number(t.value); if (v > 0){ S.settings.monthlyCap = v; saveSettings(); } },
  chatModel(t){
    const c = chat(S.view.id), p = c && persona(c.personaId);
    if (!p) return;
    p.model = t.value;
    const pr = priceFor(t.value);
    if (pr){ p.priceIn = pr[0]; p.priceOut = pr[1]; }
    savePersonas();
    toast(`${modelLabel(p.model)}にしたよ`);
    render({ keepScroll: true });
  },
  async attachFile(t){
    S.ui.att = S.ui.att || [];
    for (const f of t.files){
      try {
        if (f.type.startsWith('image/')){
          if (S.ui.att.filter(a => a.kind === 'image').length >= 4){ toast('写真は一度に4枚までだよ'); continue; }
          S.ui.att.push(await shrinkImage(f));
        } else if (f.type === 'application/pdf' || /\.pdf$/i.test(f.name)){
          if (f.size > 20 * 1024 * 1024){ toast('PDFが大きすぎるよ（20MBまで）'); continue; }
          S.ui.att.push({ kind: 'pdf', name: f.name, data: await toBase64(f) });
        } else {
          S.ui.att.push({ kind: 'text', name: f.name, text: await f.text() });
        }
      } catch(e){ toast(`${f.name} が読めなかったよ`); }
    }
    t.value = '';
    render({ keepScroll: true });
  },
  modelSel(t){
    const box = $('#pModel');
    if (t.value === '__other'){ box.style.display = ''; box.value = ''; box.focus(); return; }
    box.style.display = 'none';
    box.value = t.value;
    const pr = priceFor(t.value);
    if (pr){ $('#pIn').value = pr[0]; $('#pOut').value = pr[1]; }
    collectPD();
  },
  async knowFile(t){
    collectPD();
    for (const f of t.files){
      try { S.ui.pd.knowledge.push({ name: f.name.replace(/\.(txt|md)$/i, ''), text: await f.text() }); }
      catch(e){ toast(`${f.name} が読めなかったよ`); }
    }
    render();
  },
  async restoreFile(t){
    const f = t.files[0];
    if (!f) return;
    let j;
    try { j = JSON.parse(await f.text()); } catch(e){ toast('ファイルが読めなかったよ'); return; }
    if (!j || j.app !== 'minna-no-oheya' || !j.data){ toast('このアプリのバックアップじゃないみたい'); return; }
    if (!confirm('今のデータを全部、このバックアップの中身に置きかえます。いい？')) return;
    const key = S.settings.apiKey;
    await DB.clear();
    for (const [k, v] of Object.entries(j.data)) await DB.set(k, v);
    S.msgs = {};
    await load();
    S.settings.apiKey = key; await saveSettings();
    S.view = { name: 'home' }; S.ui = {};
    history.replaceState(S.view, '');
    render();
    toast('バックアップから戻したよ');
  },
};

// 写真は送る前に小さくする（長いほうの辺を1568pxまで、JPEG）
function shrinkImage(file){
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const max = 1568, sc = Math.min(1, max / Math.max(img.width, img.height));
      const cv = document.createElement('canvas');
      cv.width = Math.round(img.width * sc); cv.height = Math.round(img.height * sc);
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      URL.revokeObjectURL(url);
      resolve({ kind: 'image', mime: 'image/jpeg', name: file.name, data: cv.toDataURL('image/jpeg', 0.85).split(',')[1] });
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('image')); };
    img.src = url;
  });
}
function toBase64(file){
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(String(r.result).split(',')[1]);
    r.onerror = () => reject(r.error);
    r.readAsDataURL(file);
  });
}

/* ===== イベント ===== */
// 返事が終わったあとに入力欄を押したら、上に置いていたメッセージを解いて、いちばん新しいところを見せる
app.addEventListener('focusin', e => {
  if (e.target.id === 'input' && !S.ui.cfocus){ S.ui.cfocus = true; updateCompact(); }
});
app.addEventListener('focusout', e => {
  if (e.target.id !== 'input') return;
  // ボタンを押す前に形が変わってずれないよう、少し待ってから細くする
  setTimeout(() => {
    const a = document.activeElement;
    if (a && a.closest && a.closest('.cbox')) return;
    S.ui.cfocus = false; updateCompact();
  }, 250);
});
app.addEventListener('focusin', e => {
  if (e.target.id !== 'input' || S.stream || S.ui.anchor == null) return;
  S.ui.anchor = null;
  const box = $('#msgs');
  if (box){ layoutAnchor(false); box.scrollTop = box.scrollHeight; }
});
// 会話を指で動かしたら、それ以降は自動で位置を合わせない（次に送るまで）
['touchstart', 'wheel'].forEach(ev => app.addEventListener(ev, e => {
  if (e.target.closest && e.target.closest('#msgs')) S.ui.userScrolled = true;
}, { passive: true }));
app.addEventListener('click', e => {
  if (S.ui.menu && !e.target.closest('.menu, [data-act="chatMenu"]')){ S.ui.menu = false; render({ keepScroll: true }); }
  const t = e.target.closest('[data-act]');
  if (t && actions[t.dataset.act]) actions[t.dataset.act](t, e);
});
// チャット一覧の長押しで消す
app.addEventListener('contextmenu', async e => {
  const t = e.target.closest('.thread');
  if (!t) return;
  e.preventDefault();
  if (await removeChat(t.dataset.id)) render();
});
app.addEventListener('change', e => {
  const k = e.target.dataset && e.target.dataset.change;
  if (k && changes[k]) changes[k](e.target, e);
});
app.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'input'){ S.ui.draft = t.value; autosize(t); }
  if (t.id === 'pInst'){ const c = $('#instCount'); if (c) c.textContent = t.value.length + '文字'; }
  if (t.id === 'pMem'){ const c = $('#memCount'); if (c) c.textContent = t.value.length + '文字'; }
  if (t.id === 'userPrefs'){ const c = $('#prefCount'); if (c) c.textContent = t.value.length + '文字'; }
});

if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(() => {});
(async () => {
  try {
    await load();
    history.replaceState(S.view, '');

  }
})();
