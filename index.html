<!doctype html>
<!--
  La Brume Enchantée（みんなのお部屋アプリ）
  アリサ専用。Claude APIで、みんなと話すためのアプリ。
  ・サーバーなし。データはすべてこのスマホのブラウザ（IndexedDB）の中。
  ・APIキーは設定画面で貼る。コードには書かない。
  ・このファイル1個で全部動く。直すときは、このファイルを丸ごと置き直す。
  詳しくは「引き継ぎ書」へ。
-->
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#2B2A27">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="La Brume">
<title>La Brume</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Playfair+Display:wght@500&display=swap">
<style>
:root{
  --bg:#2B2A27; --surface:#393834; --surface2:#4A4843;
  --text:#E8E2D6; --muted:#B5AFA4; --line:rgba(255,255,255,.09);
  --accent:#DDD6C9; --onaccent:#2B2A27; --warn:#E6C27E; --error:#E8A193;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);overscroll-behavior-y:none}
body{font-family:'Noto Sans JP','Noto Sans CJK JP',sans-serif;font-size:16px;line-height:1.6;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
#app{position:relative;height:100%;display:flex;flex-direction:column;max-width:640px;margin:0 auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{display:flex;align-items:center;gap:6px;padding:8px 10px;border-bottom:1px solid var(--line);flex-shrink:0;min-height:60px}
.top.slim{min-height:48px;padding:2px 6px;border-bottom:none}
.top.slim .title{display:flex;flex-direction:column;justify-content:center;gap:1px}
.top.slim .tline{display:flex;align-items:baseline;gap:8px}
.cstat{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);white-space:nowrap}
.cbar{width:36px;height:3px;border-radius:2px;background:rgba(255,255,255,.12);overflow:hidden;flex-shrink:0}
.cbar>i{display:block;height:100%;background:var(--muted)}
.cbar.near>i{background:var(--warn)}
.top.slim h1{font-size:16px}
.mini{font-size:12px;color:var(--muted);white-space:nowrap}
.mini.warn{color:var(--warn)}
.menu{position:absolute;right:10px;top:calc(env(safe-area-inset-top,0px) + 48px);background:var(--surface2);border-radius:12px;padding:4px;z-index:5;box-shadow:0 6px 20px rgba(0,0,0,.45)}
.menu button{display:block;min-height:44px;padding:0 18px;border:none;background:none;color:var(--error);font-size:14px;width:100%;text-align:left;border-radius:8px}
.cbox.compact{display:flex;align-items:center;gap:6px;padding:6px;border-radius:30px}
.cbox.compact .crow{display:contents}
.cbox.compact .cbtn{order:0}
.cbox.compact textarea{order:1;flex:1;min-width:0;min-height:40px;padding:8px 6px}
.cbox.compact .mchip,.cbox.compact .grow{display:none}
.cbox.compact .send{order:2}
.top .title{flex:1;min-width:0}
.top h1{font-size:18px;margin:0;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sub{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.big{font-size:26px;font-weight:700;margin:0;padding:20px 16px 4px}
.iconbtn{width:44px;height:44px;border:none;background:none;border-radius:22px;display:flex;align-items:center;justify-content:center;color:var(--accent);flex-shrink:0}
.iconbtn:active{background:var(--surface)}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.pad{padding:16px}
.sub{font-size:13px;color:var(--muted)}

.card{background:var(--surface);border-radius:16px;padding:16px;margin-bottom:16px}
.usage-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.amount{font-size:20px;font-weight:700}
.bar{height:8px;border-radius:4px;background:rgba(255,255,255,.1);overflow:hidden;margin-top:10px}
.bar>div{height:100%;background:var(--accent)}
.warn .bar>div{background:var(--warn)}
.warn .amount{color:var(--warn)}

.row{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;display:flex;align-items:center;gap:14px;min-height:68px;padding:10px 12px;border-radius:14px;background:var(--surface);border:none;width:100%;text-align:left;margin-bottom:8px;color:var(--text)}
.row:active{background:var(--surface2)}
.row .grow{flex:1;min-width:0}
.row .name{font-size:17px;font-weight:700}
.avatar{width:44px;height:44px;border-radius:22px;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0}
.avatar{overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.iconrow{display:flex;align-items:center;gap:10px}
.iconrow .btn{width:auto;min-height:44px}
.avatar.s{width:36px;height:36px;font-size:15px}
.row.thread{min-height:50px;padding:6px 12px 6px 16px;margin-bottom:6px;border-radius:12px}
.thread .grow{display:flex;align-items:baseline;gap:12px}
.thread .no{font-size:13px;color:var(--muted);min-width:3.2em}
.thread .date{font-size:15px}

.btn{display:block;min-height:48px;border-radius:14px;border:none;background:var(--accent);color:var(--onaccent);font-weight:700;padding:0 18px;width:100%;font-size:15px}
.btn.ghost{background:transparent;color:var(--text);border:1px solid rgba(255,255,255,.18);font-weight:500}
.btn.danger{background:transparent;color:var(--error);border:1px solid rgba(232,161,147,.45);font-weight:500}
.btn+.btn{margin-top:10px}
.btns{display:flex;gap:10px}
.btns .btn{margin-top:0}
.notice{border:1px solid rgba(230,194,126,.45);color:var(--warn);border-radius:14px;padding:12px 14px;font-size:14px;margin-bottom:16px}
.empty{color:var(--muted);text-align:center;padding:32px 8px;font-size:14px}

.chip{font-size:12px;color:var(--accent);background:var(--surface);border-radius:999px;padding:5px 10px;white-space:nowrap;flex-shrink:0}
.chip.warn{color:var(--warn)}

.msgs{position:relative;overflow-anchor:none;flex:1;overflow-y:auto;padding:16px 14px 8px;display:flex;flex-direction:column;gap:12px;-webkit-overflow-scrolling:touch}
.bubble{max-width:88%;padding:10px 14px;font-size:14.5px;line-height:1.65;letter-spacing:.02em;white-space:pre-wrap;word-break:break-word;overflow-wrap:anywhere}
.bubble p{margin:0}
.bubble p+p{margin-top:.9em}
.bubble .dsc{color:#B9B2A6}
.bubble.ai{align-self:flex-start;background:var(--surface);border-radius:18px 18px 18px 6px}
.bubble.me{align-self:flex-end;background:var(--surface2);border-radius:18px 18px 6px 18px;border:none;text-align:left;color:var(--text)}
.dim{opacity:.35}
.acts{display:flex;gap:2px;margin-top:-8px}
.acts.r{align-self:flex-end}
.acts.l{align-self:flex-start}
.act.icon{width:40px;padding:0;display:flex;align-items:center;justify-content:center}
.act{min-height:40px;padding:0 10px;border:none;background:none;color:var(--muted);font-size:13px;border-radius:10px}
.act:active{background:var(--surface)}
.act:disabled{opacity:1}
.note{font-size:12px;color:var(--muted);align-self:flex-start;margin-top:-8px;padding-left:6px}
.err{align-self:stretch;border:1px solid rgba(232,161,147,.45);border-radius:14px;padding:12px 14px;color:var(--error);font-size:14px}
.err .detail{font-size:12px;color:var(--muted);margin-top:4px;word-break:break-all}
.err .btn{margin-top:10px;min-height:44px}
.dots{display:inline-flex;gap:5px;padding:4px 0}
.dots i{width:7px;height:7px;border-radius:4px;background:var(--muted);animation:blink 1.2s infinite}
.dots i:nth-child(2){animation-delay:.2s}
.dots i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}

.editbar{display:flex;align-items:center;justify-content:space-between;padding:2px 8px 2px 16px;font-size:13px;color:var(--warn);border-top:1px solid var(--line);flex-shrink:0}
.composer{padding:6px 10px 10px;flex-shrink:0}
.cbox{background:var(--surface);border:1px solid rgba(255,255,255,.08);border-radius:24px;padding:8px}
.cbox textarea{display:block;width:100%;min-height:40px;max-height:38vh;resize:none;border:none;background:transparent;color:var(--text);padding:6px 10px;font:inherit;font-size:14.5px;line-height:1.5}
.cbox textarea:focus{outline:none}
.crow{display:flex;align-items:center;gap:8px;margin-top:4px}
.crow .grow{flex:1}
.cbtn{width:40px;height:40px;border-radius:20px;border:none;background:var(--surface2);color:var(--accent);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.mchip{position:relative;display:inline-flex;align-items:center;gap:4px;height:40px;padding:0 12px 0 14px;border-radius:20px;background:var(--surface2);font-size:13px;color:var(--text);white-space:nowrap}
.mchip select{position:absolute;inset:0;width:100%;height:100%;opacity:0;font-size:16px}
.atts{display:flex;gap:8px;flex-wrap:wrap;padding:2px 2px 8px}
.att{position:relative;width:64px;height:64px;border-radius:12px;overflow:hidden;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:11px;line-height:1.3;color:var(--muted);text-align:center;padding:4px;word-break:break-all}
.att img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.att .x{position:absolute;top:3px;right:3px;width:24px;height:24px;border-radius:12px;border:none;background:rgba(0,0,0,.65);color:#fff;font-size:13px;display:flex;align-items:center;justify-content:center;padding:0}
.thinkbtn{align-self:flex-start;margin-bottom:-6px}
.thinkbox{align-self:flex-start;max-width:88%;border-left:2px solid var(--surface2);padding:2px 0 2px 12px;font-size:13px;line-height:1.7;color:var(--muted);white-space:pre-wrap;word-break:break-word}
.cutbox{align-self:stretch;background:var(--surface);border-radius:14px;padding:12px 14px;font-size:13px;line-height:1.7}
.cutbox .btns{margin-top:10px}
.cutbox .btn{min-height:44px}
.cutbox .btns .btn{flex:1 1 0;width:auto;min-width:0;padding-left:6px;padding-right:6px;white-space:nowrap}
.cutbox .btns .btn.wide{flex-grow:1.5}
.cutline{align-self:stretch;text-align:center;font-size:11px;color:var(--muted);border-top:1px dashed rgba(255,255,255,.15);padding-top:6px}
.cutline.soft{opacity:.6;border-top-color:rgba(255,255,255,.1)}
.tbwrap{position:relative;height:0;flex-shrink:0}
.tobottom{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);min-height:40px;padding:0 16px;border-radius:20px;background:var(--surface2);color:var(--text);font-size:13px;border:none;box-shadow:0 2px 10px rgba(0,0,0,.35);white-space:nowrap;z-index:2}
.who{display:flex;align-items:center;gap:6px;font-size:12px;padding-left:4px;margin-bottom:-6px;align-self:flex-start}
.who i{width:8px;height:8px;border-radius:4px;display:block}
.gmem{display:flex;align-items:center;gap:12px;min-height:52px;padding:6px 4px;font-size:15px}
.gmem input{width:22px;height:22px;accent-color:var(--accent)}
.bimgs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.bimgs img{width:120px;height:120px;object-fit:cover;border-radius:10px;display:block}
.bfile{font-size:12px;color:var(--muted);margin-bottom:4px}
.editbar+.composer{border-top:none}
.send{width:40px;height:40px;border-radius:20px;border:none;background:var(--accent);color:var(--onaccent);display:flex;align-items:center;justify-content:center;flex-shrink:0}

label.f{display:block;font-size:13px;color:var(--muted);margin:20px 0 6px}
label.f:first-child{margin-top:4px}
select.t{-webkit-appearance:none;appearance:none;min-height:48px}
input.t,textarea.t,select.t{width:100%;border:none;border-radius:12px;background:var(--surface);color:var(--text);padding:12px 14px;font:inherit;font-size:16px}
textarea.t{min-height:180px;line-height:1.6;resize:vertical}
textarea.t.small{min-height:120px}
.pair{display:flex;gap:10px}
.pair>div{flex:1}
.toggle{display:flex;align-items:center;gap:12px;min-height:48px;font-size:15px}
.toggle input{width:22px;height:22px;accent-color:var(--accent)}
.keyrow{display:flex;gap:8px}
.keyrow input{flex:1}
.keyrow .btn{width:auto}
.kgroup{font-size:12px;color:var(--muted);margin:14px 0 6px}
.kcard{background:var(--surface);border-radius:12px;padding:4px 6px 4px 4px;margin-bottom:6px}
.kcard .ktop{display:flex;align-items:center;gap:6px}
.kexp{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:1px;min-height:48px;justify-content:center;padding:4px 10px;border:none;background:none;color:var(--text);text-align:left;border-radius:10px}
.kexp:active{background:var(--surface2)}
.kexp .kn{max-width:100%;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kexp .kd{max-width:100%;font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kmore{display:flex;align-items:center;gap:6px;padding:2px 4px 6px 10px}
.kmore input.kdesc{flex:1;margin-top:0}
.kcard input.kdesc{width:100%;margin-top:4px;border:none;border-radius:10px;background:var(--bg);color:var(--text);padding:9px 12px;font:inherit;font-size:14px}
.kcard.off{opacity:.85}
.shelflog{font-size:12px;color:var(--muted);margin-bottom:10px;line-height:1.7}
.trbar{display:flex;gap:4px;margin:-6px -10px 6px}
.trbar .act{color:var(--accent)}
.thinktext.orig{user-select:text;-webkit-user-select:text}
.trfail{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.7;word-break:break-word}
.kitem{display:flex;align-items:center;gap:8px;background:var(--surface);border-radius:12px;padding:6px 6px 6px 14px;margin-bottom:6px}
.kitem .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.section{margin-top:28px;padding-top:8px;border-top:1px solid var(--line)}
.section h2{font-size:15px;margin:12px 0 4px}
.hint{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.6}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--accent);color:var(--onaccent);padding:8px 16px;border-radius:999px;font-size:14px;z-index:40}
.mchip{border:none;cursor:pointer}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20;animation:fadein .2s}
.sheet{overscroll-behavior:contain;position:fixed;left:0;right:0;bottom:0;max-width:640px;margin:0 auto;background:#232220;border-radius:24px 24px 0 0;z-index:21;height:58vh;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px);animation:slideup .22s ease-out;transition:height .2s ease}
.sheet.full{height:calc(100% - env(safe-area-inset-top,0px) - 12px)}
.sheet.fit{height:auto;max-height:85vh}
.grab{width:44px;height:5px;border-radius:3px;background:rgba(255,255,255,.22);margin:8px auto 0;flex-shrink:0}
.shead{display:flex;align-items:center;padding:2px 6px;flex-shrink:0;touch-action:none}
.shead h2{flex:1;text-align:center;font-size:16px;margin:0}
.sbody{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:6px 16px 20px;-webkit-overflow-scrolling:touch}
.mlist{background:var(--surface);border-radius:16px;overflow:hidden}
.mrow{display:flex;align-items:center;width:100%;min-height:56px;padding:0 18px;border:none;background:none;color:var(--text);font-size:16px;text-align:left;border-bottom:1px solid rgba(255,255,255,.06)}
.mrow:last-child{border-bottom:none}
.mrow:active{background:var(--surface2)}
.mrow .grow{flex:1}
.mrow .ck{color:#9DB8E3;display:flex}
.thinktext{font-size:14px;line-height:1.8;color:var(--text);white-space:pre-wrap;word-break:break-word}
@keyframes slideup{from{transform:translateY(100%)}to{transform:none}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes slidein{from{transform:translateX(-100%)}to{transform:none}}
.drawer{position:fixed;top:0;bottom:0;left:0;width:min(84vw,330px);background:#1F1E1C;z-index:21;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);animation:slidein .22s ease-out}
.brand{font-family:'Playfair Display',serif;font-weight:500;font-size:26px;padding:22px 20px 8px;color:var(--text)}
.brand-h{font-family:'Playfair Display',serif;font-weight:500}
.dbody{flex:1;overflow-y:auto;padding:0 10px}
.dsec{font-size:12px;color:var(--muted);padding:18px 12px 6px}
.drow{display:flex;align-items:center;gap:12px;width:100%;min-height:48px;padding:6px 12px;border:none;background:none;color:var(--text);text-align:left;border-radius:12px;font-size:15px}
.drow:active{background:var(--surface)}
.drow .grow{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dfoot{display:flex;align-items:center;gap:6px;padding:10px 10px;border-top:1px solid var(--line)}
.dfoot .sub{flex:1}
.sec{margin-top:30px}
.sec:first-child{margin-top:4px}
.sec>h2{font-size:13px;color:var(--muted);font-weight:500;margin:0 0 8px}
.sec .hint{margin-top:6px}
.srow{display:flex;align-items:center;gap:14px;min-height:56px;padding:8px 0;cursor:pointer}
.srow .stext{flex:1;display:flex;flex-direction:column;gap:2px}
.sname{font-size:15px}
.ssub{font-size:12px;color:var(--muted);line-height:1.5}
input.switch{-webkit-appearance:none;appearance:none;width:50px;height:30px;border-radius:15px;background:var(--surface2);position:relative;flex-shrink:0;transition:background .2s;margin:0;cursor:pointer}
input.switch::before{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:12px;background:#CFC8BC;transition:transform .2s}
input.switch:checked{background:var(--accent)}
input.switch:checked::before{transform:translateX(20px);background:var(--onaccent)}
/* 思い出の日記 */
.menu button.n{color:var(--text)}
.dcard{align-self:flex-start;width:88%;max-width:440px;background:var(--surface);border-radius:18px;padding:14px 16px 8px;border-top:3px solid var(--dc,#8aa0b8)}
.dcard .dk{font-size:12px;color:var(--muted)}
.dcard .dt{font-size:17px;font-weight:700;margin-top:6px;line-height:1.5}
.dcard .ds{font-size:13px;color:var(--muted)}
.dcard .dm{font-size:12px;color:var(--muted);margin-top:8px}
.dcard .btns{margin-top:12px}
.dcard .btn{min-height:44px}
.dcard .dend{display:flex;justify-content:flex-end;margin-top:2px}
.dsh{font-size:13px;color:var(--muted);margin:16px 2px 8px}
.dsh:first-child{margin-top:4px}
.dview{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column}
.dvtop{display:flex;align-items:center;gap:6px;padding:calc(env(safe-area-inset-top,0px) + 4px) 10px 4px 4px;color:var(--text);flex-shrink:0}
.dvtop .grow{flex:1;min-width:0;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dvtop .btn{width:auto;min-height:40px}
.dvframe{flex:1;width:100%;border:none;background:#fff}
.dload{position:fixed;inset:0;z-index:31;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;color:var(--text);font-size:14px}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.swatch{position:relative;display:flex;align-items:center;gap:8px;min-height:44px;padding:4px 14px 4px 6px;border-radius:22px;background:var(--surface);font-size:14px;cursor:pointer}
.swatch input{position:absolute;opacity:0;width:1px;height:1px}
.swatch i{width:30px;height:30px;border-radius:15px;display:block;border:2px solid transparent}
.swatch:has(input:checked){background:var(--surface2)}
.swatch input:checked+i{border-color:var(--text)}
.swatch input:focus-visible+i{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.sheet,.drawer,.scrim{animation:none}}
@media (prefers-reduced-motion:reduce){.dots i{animation:none;opacity:.6}}
</style>
</head>

/* ===== 基本設定 ===== */
const APP_VERSION = '0.14.6';
const BACKUP_FORMAT = 1;
const API_URL = 'https://api.anthropic.com/v1/messages';
const MAX_TOKENS = 32000;

// モデル名の候補と、1Mトークンあたりの料金（入力, 出力 / ドル）
// 料金は目安。お部屋の設定画面でひとりずつ書き換えられる。
// [モデル名, 入力, 出力, 表示名, キャッシュ読み込み]（1Mトークンあたりのドル。公式の料金表 2026.10.25）
// キャッシュ書き込みは、どのモデルも5分＝入力×1.25、1時間＝入力×2
const MODELS = [
  ['claude-fable-5-2',  8, 40, 'Fable 5.2', 0.20], // 2026.11.09 公開（開発者サイトの「モデルを比較」で確認）
  ['claude-fable-5-1', 10, 50, 'Fable 5.1', 0.25],
  ['claude-fable-5',   10, 50, 'Fable 5',   1],
  ['claude-opus-5-5',   4, 20, 'Opus 5.5',  0.20],
  ['claude-opus-5',     5, 25, 'Opus 5',    0.50],
  ['claude-opus-4-8',   5, 25, 'Opus 4.8',  0.50],
  ['claude-opus-4-7',   5, 25, 'Opus 4.7',  0.50],
  ['claude-opus-4-6',   5, 25, 'Opus 4.6',  0.50],
  ['claude-sonnet-5-5', 2, 10, 'Sonnet 5.5', 0.10],
  ['claude-haiku-5-5', 0.1, 0.5, 'Haiku 5.5', 0.01], // 10万トークン以下の場合。超えると 0.5・2.5・0.05
];
function priceFor(model){
  const m = MODELS.find(x => x[0] === model);
  return m ? [m[1], m[2]] : null;
}
function modelLabel(model){
  const m = MODELS.find(x => x[0] === model);
  return m ? m[3] : model;
}

/* ===== 小道具 ===== */
const $ = s => document.querySelector(s);
const app = $('#app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const WD = ['日','月','火','水','木','金','土'];
const pad2 = n => String(n).padStart(2, '0');
function ymd(d = new Date()){ return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; }
function shortDate(iso){
  const [y, m, d] = iso.split('-').map(Number);
  const dt = new Date(y, m - 1, d);
  return `${String(y).slice(2)}.${pad2(m)}.${pad2(d)}(${WD[dt.getDay()]})`;
}
function jpDate(d = new Date()){ return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日（${WD[d.getDay()]}）`; }
function monthKey(d = new Date()){ return `${d.getFullYear()}-${pad2(d.getMonth()+1)}`; }
// 「今回」の区切り：クレジットの請求期間に合わせる（初期は22日〜翌21日）。キーは区切りが始まった月
function periodStart(d = new Date()){
  const cd = Math.min(28, Math.max(1, Number(S.settings && S.settings.cycleDay) || 22));
  let y = d.getFullYear(), m = d.getMonth();
  if (d.getDate() < cd){ m -= 1; if (m < 0){ m = 11; y -= 1; } }
  return { y, m, cd };
}
function periodKey(d = new Date()){ const p = periodStart(d); return `${p.y}-${pad2(p.m + 1)}`; }
function periodLabel(){ const p = periodStart(); return `${p.m + 1}/${p.cd}〜`; }
const money = n => '$' + (n || 0).toFixed(2);
// 空行で段落に分けて表示する（空行がそのまま大きなすき間にならないように）
// （）の中（しぐさ）は少し薄い色にする
const deco = h => h.replace(/[（(][^（）()\n]{0,400}[）)]/g, m => `<span class="dsc">${m}</span>`);
// （）だけの行は、前後を一行あけて段落として見せる（しぐさの次の行が詰まって見えないように）
const isActLine = l => /^[\s\u3000]*[（(].*[）)][\s\u3000]*$/.test(l);
function spaceActs(t){
  const lines = t.split('\n'), out = [];
  lines.forEach((l, i) => {
    if (isActLine(l) && out.length && out[out.length - 1].trim()) out.push('');
    out.push(l);
    if (isActLine(l) && i < lines.length - 1 && lines[i + 1].trim()) out.push('');
  });
  return out.join('\n');
}
const fmt = t => spaceActs(String(t || '').replace(/^\s+|\s+$/g, '')).split(/\n[ \t\u3000]*\n+/).map(p => `<p>${deco(esc(p))}</p>`).join('');

const ICON = {

  more:'<svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.8" fill="currentColor"/><circle cx="12" cy="12" r="1.8" fill="currentColor"/><circle cx="19" cy="12" r="1.8" fill="currentColor"/></svg>',

  copy:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h8"/></svg>',

  edit:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16v4z"/></svg>',
  back:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>',
  chev:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#B5AFA4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg>',
  send:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5"/><path d="M5 12l7-7 7 7"/></svg>',
  stop:'<svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor"/></svg>',
  gear:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>',
  trash:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/></svg>',
};

/* ===== 保存場所（IndexedDB） =====
   キーと中身：
   settings            … {apiKey, sendDate, monthlyCap}
   personas            … みんなの配列
   chats               … チャットの配列
   usage               … {'2026-10': 使った金額(ドル)}
   msgs:<チャットのid> … そのチャットの会話の配列
*/
const DB = {
  db: null,
  open(){
    return new Promise((res, rej) => {
      const r = indexedDB.open('minna-no-oheya', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('kv');
      r.onsuccess = () => { this.db = r.result; res(); };
      r.onerror = () => rej(r.error);
    });
  },
  _req(mode, fn){
    return new Promise((res, rej) => {
      const r = fn(this.db.transaction('kv', mode).objectStore('kv'));
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    });
  },
  get(k){ return this._req('readonly', s => s.get(k)); },
  set(k, v){ return this._req('readwrite', s => s.put(v, k)); },
  del(k){ return this._req('readwrite', s => s.delete(k)); },
  keys(){ return this._req('readonly', s => s.getAllKeys()); },
  clear(){ return this._req('readwrite', s => s.clear()); },
  // 全部消して書き込むのを、ひとつのまとまり（トランザクション）でやる。途中で失敗したら、元のデータのまま残る
  replaceAll(entries){
    return new Promise((res, rej) => {
      const tx = this.db.transaction('kv', 'readwrite');
      const st = tx.objectStore('kv');
      st.clear();
      for (const [k, v] of entries) st.put(v, k);
      tx.oncomplete = () => res();
      tx.onerror = () => rej(tx.error);
      tx.onabort = () => rej(tx.error || new Error('abort'));
    });
  },
};

/* ===== 状態 ===== */
const S = {
  settings: null, personas: [], chats: [], usage: {}, msgs: {},
  view: { name: 'home' }, ui: {}, stream: null,
};

function newPersona(name, initial, model){
  const p = priceFor(model) || [10, 50];
  return { id: uid(), name, initial, model, priceIn: p[0], priceOut: p[1], instructions: '', think: true, knowledge: [], memory: '', nextNo: 1 };
}

async function load(){
  await DB.open();
  S.settings = Object.assign({ apiKey: '', sendDate: true, monthlyCap: 100, userPrefs: '', showThink: false, cutChars: 60000, cycleDay: 22, memChars: 4000 }, (await DB.get('settings')) || {});
  S.personas = (await DB.get('personas')) || [];
  S.chats = (await DB.get('chats')) || [];
  S.usage = (await DB.get('usage')) || {};
  if (!S.personas.length){
    S.personas = [newPersona('スズ', '硯', 'claude-opus-5')];
    await savePersonas();
  }
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch(e){}
}
const saveSettings = () => DB.set('settings', S.settings);
const savePersonas = () => DB.set('personas', S.personas);
const saveChats = () => DB.set('chats', S.chats);
const saveUsage = () => DB.set('usage', S.usage);
async function getMsgs(cid){
  if (!S.msgs[cid]) S.msgs[cid] = (await DB.get('msgs:' + cid)) || [];
  return S.msgs[cid];
}
const saveMsgs = cid => DB.set('msgs:' + cid, S.msgs[cid] || []);
const persona = id => S.personas.find(p => p.id === id);
const chat = id => S.chats.find(c => c.id === id);
const monthUsed = () => S.usage[periodKey()] || 0;
const isWarn = () => monthUsed() >= (Number(S.settings.monthlyCap) || 100) * 0.8;
const initialOf = p => (p.initial || p.name || '？').slice(0, 2);
const avatarHtml = (p, cls = '') => `<span class="avatar${cls ? ' ' + cls : ''}">${p.avatar ? `<img src="${p.avatar}" alt="">` : esc(initialOf(p))}</span>`;

/* ===== 画面の切り替え（スマホの戻るボタンにも対応） ===== */
function go(view){
  S.view = view; S.ui = {};
  history.pushState(view, '');
  render();
}
window.addEventListener('popstate', async e => {
  // 日記を閉じたとき：下のチャットはそのまま（読んでいた位置も、書きかけも残す）
  const dv = document.getElementById('dview');
  if (dv){
    dv.remove();
    const st = e.state;
    if (st && st.name === S.view.name && st.id === S.view.id) return;
  }
  S.view = e.state || { name: 'home' };
  S.ui = {};
  if (S.view.name === 'chat') await getMsgs(S.view.id);
  render();
});

/* ===== 画面 ===== */
function homeView(){
  const used = monthUsed(), cap = Number(S.settings.monthlyCap) || 100;
  const pct = Math.min(100, used / cap * 100);
  let h = `<div class="top"><button class="iconbtn" data-act="openDrawer" aria-label="メニュー">${ICON.menu}</button><div class="title"><h1 class="brand-h">La Brume Enchantée</h1></div>
    <button class="iconbtn" data-act="settings" aria-label="設定">${ICON.gear}</button></div>
    <div class="scroll"><div class="pad">`;
  if (!S.settings.apiKey) h += `<div class="notice">設定でAPIキーを貼ると、話せるようになるよ</div>`;
  h += `<div class="card ${isWarn() ? 'warn' : ''}"><div class="usage-top"><span class="sub">今回の使用額（${periodLabel()}）</span>
    <span><span class="amount">${money(used)}</span> <span class="sub">/ ${money(cap)}</span></span></div>
    <div class="bar"><div style="width:${pct}%"></div></div></div>`;
  for (const p of S.personas){
    h += `<button class="row" data-act="openPersona" data-id="${p.id}">
      ${avatarHtml(p)}
      <span class="grow"><span class="name">${esc(p.name)}</span><br><span class="sub">${esc(p.model)}</span></span>${ICON.chev}</button>`;
  }
  h += `<div class="btns" style="margin-top:8px"><button class="btn ghost" data-act="newPersona">お部屋を追加</button><button class="btn ghost" data-act="newGroup">みんなの部屋を追加</button></div>`;
  h += `</div></div>`;
  return h;
}

function threadsView(pid){
  const p = persona(pid);
  if (!p) return homeView();
  const list = S.chats.filter(c => c.personaId === pid).sort((a, b) => b.updatedAt - a.updatedAt);
  let h = `<div class="top"><button class="iconbtn" data-act="back" aria-label="戻る">${ICON.back}</button>
    <div class="title"><h1>${esc(p.name)}</h1></div>
    <button class="iconbtn" data-act="editPersona" data-id="${p.id}" aria-label="お部屋の設定">${ICON.gear}</button></div>
    <div class="scroll"><div class="pad">
    <button class="btn" data-act="newChat" data-id="${p.id}" style="margin-bottom:16px">新しいチャット</button>`;
  if (!list.length) h += `<div class="empty">まだチャットはありません</div>`;
  for (const c of list){
    h += `<button class="row thread" data-act="openChat" data-id="${c.id}">
      <span class="grow"><span class="no">No.${c.no}</span><span class="date">${shortDate(c.start)}〜</span></span>${ICON.chev}</button>`;
  }
  return h + `</div></div>`;
}

// 入力欄：何も打っていないときは一段の細い形、押すと二段に広がる
function composerCompact(){
  return !S.ui.cfocus && !String(S.ui.draft || '').trim() && !(S.ui.att || []).length && S.ui.editIndex == null;
}
function updateCompact(){
  const cb = document.querySelector('.cbox');
  if (cb) cb.classList.toggle('compact', composerCompact());
}
// ===== 下から出てくる画面（モデルを選ぶ・考えたこと） =====
function sheetHtml(){
  const sh = S.ui.sheet, c = chat(S.view.id), p = c && persona(c.personaId);
  if (!sh || !p) return '';
  let title = '', body = '', cls = '';
  if (sh.type === 'model'){
    title = 'モデルを選択'; cls = 'fit';
    body = `<div class="mlist">${MODELS.map(m => `<button class="mrow" data-act="pickModel" data-m="${m[0]}"><span class="grow">${esc(m[3])}</span>${m[0] === p.model ? `<span class="ck">${ICON.check}</span>` : ''}</button>`).join('')}</div>
      <div class="mlist" style="margin-top:12px">${sh.custom
        ? `<div style="padding:12px"><input class="t" id="customModel" placeholder="モデル名（claude-…）" value="${priceFor(p.model) ? '' : esc(p.model)}" autocomplete="off" spellcheck="false" aria-label="モデル名"><button class="btn" data-act="pickCustomModel" style="margin-top:10px">これにする</button></div>`
        : `<button class="mrow" data-act="customModel"><span class="grow">ほかのモデル${priceFor(p.model) ? '' : `（${esc(p.model)}）`}</span>${priceFor(p.model) ? ICON.chev : `<span class="ck">${ICON.check}</span>`}</button>`}</div>`;
  } else if (sh.type === 'think'){
    title = '考えたこと'; cls = sh.full ? 'full' : '';
    body = thinkBody(c, sh);
  } else if (sh.type === 'diary'){
    title = '日記を書いてもらう'; cls = 'fit';
    body = diarySheetBody(c, p, sh);
  }
  return `<div class="scrim" data-act="closeSheet"></div>
    <div class="sheet ${cls}" id="sheet" role="dialog" aria-label="${title}"><div class="grab"></div>
    <div class="shead"><button class="iconbtn" data-act="closeSheet" aria-label="閉じる">${ICON.x}</button><h2>${title}</h2><span style="width:44px"></span></div>
    <div class="sbody">${body}</div></div>`;
}
// 考えたこと：訳（なければ訳しているところ・訳せなかった）。英語のときは、いつでも原文に切り替えられる（原文のときはコピーも）
function thinkBody(c, sh){
    const m = (S.msgs[c.id] || [])[sh.i];
    const en = m && m.think && !isJa(m.think);
    const bar = en ? `<div class="trbar"><button class="act" data-act="toggleOrig">${sh.orig ? '訳を見る' : '原文を見る'}</button>${sh.orig ? `<button class="act" data-act="copyThink">コピー</button>` : ''}</div>` : '';
    const good = m && m.think && m.thinkJaV === THINK_TR_VER && !refusedTr(m.thinkJa, m.think) && m.thinkJa;
    let inner = '';
    if (!m || !m.think) inner = '';
    else if (good) inner = `<div class="thinktext">${esc(good)}</div>`;
    else if (isJa(m.think)) inner = `<div class="thinktext">${esc(m.think)}</div>`;
    else if (trFailed(m) || sh.err){
      // だめだったときは、HaikuとSonnetそれぞれの理由を小さく出す。訳しに行くのは「もう一度ためす」を押したときだけ
      inner = `<div class="thinktext">訳せなかったよ</div>${trFailed(m) ? `<div class="trfail">${m.thinkFail.reasons.map(r => esc(`${r.m}：${trWhy(r)}`)).join('<br>')}</div>` : ''}
        <button class="btn ghost" data-act="retryTr" style="margin-top:14px">もう一度ためす</button>`;
    } else inner = `<div class="thinktext">日本語に訳しているところ…</div>`;
    if (en && sh.orig) inner = `<div class="thinktext orig" lang="en">${esc(m.think)}</div>`;
    return (m && m.shelf ? `<div class="shelflog">${m.shelf.map(esc).join('<br>')}</div>` : '') + bar + inner;
}
// ===== サイドバー =====

  const recent = [...S.chats].sort((a, b) => b.updatedAt - a.updatedAt).slice(0, 10);
  const cur = S.view.name === 'chat' ? (chat(S.view.id) || {}).personaId : (S.view.name === 'threads' ? S.view.id : null);
  return `<div class="scrim" data-act="closeDrawer"></div>
    <nav class="drawer" aria-label="メニュー"><div class="brand">La Brume Enchantée</div><div class="dbody">
    <div class="dsec">みんな</div>

    <div class="dsec">最近のチャット</div>
    ${recent.map(c => { const p = persona(c.personaId); return `<button class="drow" data-act="openChat" data-id="${c.id}"><span class="grow">${esc(p ? p.name : '')}　No.${c.no}　<span class="sub">${shortDate(c.start)}〜</span></span></button>`; }).join('') || '<div class="sub" style="padding:8px 12px">まだありません</div>'}
    </div>
    <div class="dfoot"><button class="iconbtn" data-act="settings" aria-label="設定">${ICON.gear}</button><span class="sub">今回 ${money(monthUsed())}</span>

}
// ===== みんなの部屋（ふたり以上で話す部屋） =====
const isGroup = p => p && p.type === 'group';
const GROUP_COLORS = [{ bg: '#363A42', fg: '#A9B4C6' }, { bg: '#3B3F37', fg: '#B9C4A2' }, { bg: '#3F3A45', fg: '#C2B3D1' }];
const CORAL = { bg: '#48392F', fg: '#E0A994' };
function memberColor(g, id){
  const m = persona(id);
  if (m && /珊瑚/.test(m.name)) return CORAL;
  const others = (g.members || []).filter(x => { const y = persona(x); return !(y && /珊瑚/.test(y.name)); });
  return GROUP_COLORS[Math.max(0, others.indexOf(id)) % GROUP_COLORS.length];
}
const whoHtml = (g, id) => { const m = persona(id), c = memberColor(g, id); return `<div class="who" style="color:${c.fg}"><i style="background:${c.fg}"></i>${esc(m ? m.name : '')}</div>`; };
// ひとりから見た会話：自分の言葉は assistant、アリサとほかのひとの言葉は名前つきで user
function groupView(msgs, me){
  return msgs.map(m => {
    if (m.role === 'user') return { role: 'user', text: '【アリサ】' + (m.text || ''), att: m.att };
    if (m.who === me.id) return { role: 'assistant', text: m.text, shelf: m.shelf };
    const o = persona(m.who);
    return { role: 'user', text: `【${o ? o.name : 'だれか'}】` + m.text };
  });
}
function sceneText(g, members, me){
  const others = members.filter(x => x.id !== me.id).map(x => x.name);
  return `【いまいる場所】ここは、${others.join('と')}とアリサが一緒にいる部屋（${g.name}）。会話には、アリサの言葉が【アリサ】、${others.map(n => '【' + n + '】').join('・')}としてほかのひとの言葉が届く。自分は${me.name}として、自分の言葉としぐさだけを書く。名前の見出しはつけない。ほかのひとのセリフやしぐさは書かない。ほかのひとの言葉に反応してもいい。言うことがなければ［だまる］とだけ書く。`;
}
const nameVariants = m => [m.name, m.name.replace(/(さん|くん|ちゃん)$/, ''), m.initial].filter(x => x && x.length);
function groupOrder(c, members, text){
  let first = null, at = Infinity;
  members.forEach(m => nameVariants(m).forEach(v => { const i = (text || '').indexOf(v); if (i >= 0 && i < at){ at = i; first = m; } }));
  if (!first){
    const li = members.findIndex(m => m.id === c.lastFirst);
    first = members[li >= 0 ? (li + 1) % members.length : 0];
  }
  const fi = members.indexOf(first);
  return members.slice(fi).concat(members.slice(0, fi));
}
const isPass = t => /^[\s\u3000]*[［\[]?\s*だまる\s*[］\]]?[\s\u3000]*$/.test(t || '');
function cleanGroupReply(t, me, members){
  let s = String(t || '').replace(/^[\s\u3000]*【[^】]{1,20}】[\s\u3000]*/, '');
  members.filter(x => x.id !== me.id).forEach(o => nameVariants(o).forEach(v => {
    const i = s.indexOf('\n【' + v); if (i >= 0) s = s.slice(0, i);
  }));
  return s.trim();
}
const groupMembers = g => (g.members || []).map(persona).filter(x => x && !isGroup(x));
function newGroup(){
  return { id: uid(), type: 'group', name: '', initial: '', avatar: '', members: [], model: 'claude-opus-5-5', priceIn: 4, priceOut: 20, think: true, instructions: '', knowledge: [], memory: '', nextNo: 1 };
}

// 見出しの下の小さな表示：何往復目か（チャット全体の通し番号）と、送っている会話の量（切り落としたあとは残った分から）
const man = n => (n / 10000).toFixed(1).replace(/\.0$/, '') + '万';
function chatStat(c, msgs){
  const turns = msgs.filter(m => m.role === 'user').length;
  const lim = Number(S.settings.cutChars) || 60000;
  const used = chatChars(msgs, c.cutAt || 0);
  const pct = Math.min(100, used / lim * 100);
  return `<span class="cstat"><span>${turns}往復</span><span>${man(used)}／${man(lim)}字</span><span class="cbar${pct >= 80 ? ' near' : ''}" aria-hidden="true"><i style="width:${pct}%"></i></span></span>`;
}
function attHtml(att){
  if (!att || !att.length) return '';
  const imgs = att.filter(a => a.kind === 'image');
  const files = att.filter(a => a.kind !== 'image');
  return (imgs.length ? `<span class="bimgs">${imgs.map(a => `<img src="data:${a.mime};base64,${a.data}" alt="">`).join('')}</span>` : '')
    + files.map(a => `<span class="bfile" style="display:block">ファイル：${esc(a.name)}</span>`).join('');
}
function chatView(cid){
  const c = chat(cid);
  if (!c) return homeView();
  const p = persona(c.personaId);
  const msgs = S.msgs[cid] || [];
  const streaming = S.stream && S.stream.chatId === cid;
  const ed = S.ui.editIndex;
  let h = `<div class="top slim"><button class="iconbtn" data-act="openDrawer" aria-label="メニュー">${ICON.menu}</button>
    <div class="title"><div class="tline"><h1>${esc(p.name)}</h1><span class="mini">No.${c.no}</span></div>${chatStat(c, msgs)}</div>
    <span class="mini ${isWarn() ? 'warn' : ''}">今回 ${money(monthUsed())}</span>
    <button class="iconbtn" data-act="chatMenu" aria-label="メニュー" aria-expanded="${S.ui.menu ? 'true' : 'false'}">${ICON.more}</button></div>
    ${S.ui.menu ? `<div class="menu">${c.cutAt ? `<button class="n" data-act="jumpCut">切ったところを見る</button>` : ''}<button class="n" data-act="diaryOpen">日記を書いてもらう</button><button data-act="deleteChat" data-id="${c.id}">このチャットを消す</button></div>` : ''}
    <div class="msgs" id="msgs">`;
  if (!msgs.length && !streaming) h += `<div class="empty">${esc(p.name)}のお部屋。下から話しかけてね</div>`;
  msgs.forEach((m, i) => {
    if (c.cutAt && i === c.cutAt) h += `<div class="cutline" id="cutline">ここより前は、もう送っていないよ（探せば見つかる）</div>`;
    else if (c.cutOffer != null && i === c.cutOffer && !streaming) h += `<div class="cutline soft" id="cutmark">切るなら、ここより前（まだ送ってるよ）</div>`;
    const dim = ed != null && i >= ed ? ' dim' : '';
    if (m.role === 'user'){
      h += `<button class="bubble me${dim}" data-act="tapMine" data-i="${i}" data-mi="${i}">${attHtml(m.att)}${fmt(m.text)}</button>`;
      if (S.ui.userActions === i && !streaming){
        h += `<div class="acts r"><button class="act icon" data-act="editMsg" data-i="${i}" aria-label="書き直す">${ICON.edit}</button>
          <button class="act icon" data-act="copy" data-i="${i}" aria-label="コピー">${ICON.copy}</button></div>`;
      }
    } else {
      // 日記は吹き出しではなく、カードで出す（ひらく・保存・消す）
      if (m.diary){ h += diaryCardHtml(p, m, i, dim); return; }
      if (S.settings.showThink && (m.think || m.shelf)){
        h += `<button class="act thinkbtn" data-act="openThink" data-i="${i}">考えたこと ›</button>`;
      }
      if (m.who && isGroup(p)){ const gc = memberColor(p, m.who); h += whoHtml(p, m.who) + `<div class="bubble ai${dim}" style="background:${gc.bg}">${fmt(m.text)}</div>`; }
      else h += `<div class="bubble ai${dim}">${fmt(m.text)}</div>`;
      if (m.notes){
        if (m.memOps && !m.memUndone) h += `<div class="note">${esc(m.notes.join('・'))}<button class="act" data-act="undoMem" data-i="${i}" style="min-height:32px;margin-left:6px">取り消す</button></div>`;
        else h += `<div class="note">${m.memUndone ? 'メモリを元に戻したよ' : esc(m.notes.join('・'))}</div>`;
      }
      if (m.stopped) h += `<div class="note">途中で止めたよ</div>`;
      if (i === msgs.length - 1 && !streaming && ed == null && !(S.diaryRun && S.diaryRun.chatId === cid)){
        h += `<div class="acts l"><button class="act icon" data-act="copy" data-i="${i}" aria-label="コピー">${ICON.copy}</button>
          <button class="act icon" data-act="regen" aria-label="作り直す">${ICON.regen}</button></div>`;
      }
    }
  });
  if (streaming){
    // 「考えたこと」の場所を先に出しておく（終わってから割り込んでカクッとならないように）
    if (isGroup(p) && S.stream.who) h += whoHtml(p, S.stream.who);
    if (S.settings.showThink && p.think !== false) h += `<button class="act thinkbtn" disabled>考えたこと ›</button>`;
    h += `<div class="bubble ai" id="streamText"${isGroup(p) && S.stream.who ? ` style="background:${memberColor(p, S.stream.who).bg}"` : ''}>${streamShown() ? fmt(streamShown()) : '<span class="dots" aria-label="書いているところ"><i></i><i></i><i></i></span>'}</div>`;
  }
  if (c.cutOffer != null && msgs[c.cutOffer] && !streaming){
    const cm = msgs[c.cutOffer];
    h += `<div class="cutbox">会話が長くなってきたよ。${shortDate(ymd(new Date(cm.ts)))}の「${esc(cutSnippet(cm))}」より前を、そろそろ送らないようにするね。残したいことがあったら、先に「覚えといて」って頼んでから切ってね。画面からは消えないし、探せば見つかるよ。
      <div class="btns"><button class="btn" data-act="cutNow">切る</button><button class="btn ghost wide" data-act="jumpCut">切れ目を見る</button><button class="btn ghost" data-act="cutLater">あとで</button></div></div>`;
  }
  const memLim = Number(S.settings.memChars) || 4000, memLen = (p.memory || '').length;
  if (!streaming && !S.ui.organizing && memLen > memLim && (!p.memSnooze || memLen > p.memSnooze)){
    h += `<div class="cutbox">${esc(p.name)}のメモリが長くなってきたよ（${memLen}字）。整理してもらう？整理する前の版はとっておくから、お部屋の設定から戻せるよ。
      <div class="btns"><button class="btn" data-act="organizeMem">整理してもらう</button><button class="btn ghost" data-act="organizeLater">あとで</button></div></div>`;
  }
  if (S.ui.organizing) h += `<div class="cutbox">${esc(p.name)}がメモリを整理しているところ…</div>`;
  if (S.diaryRun && S.diaryRun.chatId === cid){
    h += `<div class="cutbox" role="status">${esc(S.diaryRun.name)}が日記を書いてるよ<br><span class="sub" id="diaryCount">${esc(diaryPhase())}</span>
      <div class="btns"><button class="btn ghost" data-act="stopDiary">止める</button></div></div>`;
  }
  const de = S.diaryErr;
  if (de && de.chatId === cid && !S.diaryRun){
    h += `<div class="err" role="alert">日記：${esc(de.message)}${de.detail ? `<div class="detail">${esc(de.detail)}</div>` : ''}
      <div class="btns"><button class="btn danger" data-act="retryDiary">もう一度</button><button class="btn ghost" data-act="closeDiaryErr">とじる</button></div></div>`;
  }
  const err = S.ui.error;
  if (err && err.chatId === cid && !streaming){
    h += `<div class="err" role="alert">${esc(err.message)}${err.detail ? `<div class="detail">${esc(err.detail)}</div>` : ''}
      ${err.retry ? `<button class="btn danger" data-act="retry">もう一度送る</button>` : ''}</div>`;
  }
  h += `<div id="spacer" style="flex-shrink:0;height:0"></div></div>`;
  if (ed != null) h += `<div class="editbar"><span>書き直し中。送ると、ここから先の返事は作り直しになるよ</span><button class="act" data-act="cancelEdit">やめる</button></div>`;
  const atts = S.ui.att || [];
  const opts = MODELS.map(m => `<option value="${m[0]}" ${m[0] === p.model ? 'selected' : ''}>${esc(m[3])}</option>`).join('')
    + (priceFor(p.model) ? '' : `<option value="${esc(p.model)}" selected>${esc(p.model)}</option>`);
  if (S.ui.jumped) h += `<div class="tbwrap"><button class="tobottom" id="toBottom" data-act="toBottom">↓ いちばん下へ</button></div>`;
  h += `<div class="composer"><div class="cbox${composerCompact() ? ' compact' : ''}">
    ${atts.length ? `<div class="atts">${atts.map((a, i) => `<div class="att">${a.kind === 'image' ? `<img src="data:${a.mime};base64,${a.data}" alt="">` : esc(a.name)}<button class="x" data-act="rmAtt" data-i="${i}" aria-label="${esc(a.name)}を外す">×</button></div>`).join('')}</div>` : ''}
    <label for="input" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">メッセージ</label>
    <textarea id="input" rows="1" placeholder="メッセージ"></textarea>
    <div class="crow">
      <button class="cbtn" data-act="attach" aria-label="写真やファイルを添える">${ICON.plus}</button>
      <button class="mchip" data-act="openModels" aria-label="モデルを選ぶ">${esc(modelLabel(p.model))}${ICON.down}</button>
      <span class="grow"></span>
      ${streaming
        ? `<button class="send" data-act="stop" aria-label="止める">${ICON.stop}</button>`
        : `<button class="send" data-act="send" aria-label="送る">${ICON.send}</button>`}
    </div></div>
    <input type="file" id="attachFile" accept="image/*,.txt,.md,.pdf,text/plain,text/markdown,application/pdf" multiple hidden data-change="attachFile">
    </div>`;
  return h;
}

  } else {

      <input type="file" id="knowFile" accept=".txt,.md,text/plain,text/markdown" multiple hidden data-change="knowFile">`;
  }
  h += `<label class="f" for="pMem">メモリ <span id="memCount">${(d.memory || '').length}文字</span></label>
    <textarea class="t" id="pMem">${esc(d.memory || '')}</textarea>
    <div class="hint">${esc(d.name || 'このひと')}が、約束や変化など大事なことを自分の判断で書きます。「覚えといて」と言えば必ず書きます。アリサが直接貼ったり直したりもできます。</div>
    ${d.memoryPrev ? `<button class="btn ghost" data-act="restoreMem" style="margin-top:10px">ひとつ前の版に戻す（整理する前）</button>` : ''}`;
  h += `<div class="section"><button class="btn" data-act="savePersona">保存する</button>`;
  if (!isNew) h += `<button class="btn danger" data-act="deletePersona" style="margin-top:28px">このお部屋を消す</button>`;
  h += `</div></div></div>`;
  return h;
}

/* ===== 描画 ===== */
function render(opts = {}){
  const v = S.view;
  // 同じ画面を描き直すときは、ページのスクロール位置をそのまま（スイッチを押して上に飛ばないように）
  const pageKey = v.name + ':' + (v.id || '');
  const oldPage = document.querySelector('.scroll');
  const pageTop = (S._pageKey === pageKey && oldPage) ? oldPage.scrollTop : 0;
  const old = $('#msgs');
  const keepTop = opts.keepScroll && old ? old.scrollTop : null;
  const hadFocus = document.activeElement && document.activeElement.id === 'input';
  let html;
  if (v.name === 'threads') html = threadsView(v.id);
  else if (v.name === 'chat') html = chatView(v.id);
  else if (v.name === 'settings') html = settingsView();
  else if (v.name === 'persona') html = personaView(v.id);
  else html = homeView();
  if (S.ui.sheet && v.name === 'chat') html += sheetHtml();
  if (S.ui.drawer) html += drawerHtml();
  app.innerHTML = html;
  S._pageKey = pageKey;
  const newPage = document.querySelector('.scroll');
  if (newPage && pageTop) newPage.scrollTop = pageTop;
  const input = $('#input');
  if (input){
    input.value = S.ui.draft || '';
    autosize(input);
    if (hadFocus || opts.focus){ input.focus(); input.setSelectionRange(input.value.length, input.value.length); }
  }
  const box = $('#msgs');
  if (box){
    if (opts.anchor || (S.ui.anchor != null && !S.ui.userScrolled && opts.keepScroll)) anchorNow(box);
    else {
      layoutAnchor(false);
      if (keepTop != null) box.scrollTop = keepTop;
      else box.scrollTop = box.scrollHeight;
    }
    watchBox(box);
    if (S.ui.jumped) watchBottom(box);
  }
}
// 切れ目に飛んだあと、自分でいちばん下の近くまで戻ったら「いちばん下へ」を消す
function watchBottom(box){
  const f = () => {
    if (box.scrollHeight - box.scrollTop - box.clientHeight > 120) return;
    S.ui.jumped = false;
    const b = $('#toBottom'); if (b) b.parentNode.remove();
    box.removeEventListener('scroll', f);
  };
  box.addEventListener('scroll', f, { passive: true });
}
// 切れ目の案内に出す、そのメッセージの最初の何文字か
function cutSnippet(m){
  const t = String(m.text || '').replace(/\s+/g, ' ').trim();
  if (!t) return (m.att || []).some(a => a.kind === 'image') ? '（写真）' : '…';
  return t.length > 24 ? t.slice(0, 24) + '…' : t;
}
// 切れ目（切る前の薄い印、または切ったあとの線）まで飛ぶ
function jumpToCut(){
  const box = $('#msgs'), el = box && (box.querySelector('#cutmark') || box.querySelector('#cutline'));
  if (!el) return false;
  S.ui.userScrolled = true; // このあと自動で位置を合わせない
  box.scrollTop = Math.max(0, el.offsetTop - 12);
  if (!S.ui.jumped){
    S.ui.jumped = true;
    const top = box.scrollTop;
    render({ keepScroll: true });
    const nb = $('#msgs'); if (nb) nb.scrollTop = top;
  }
  return true;
}
// 送ったメッセージを画面の上に置くための、下の余白の調整
function layoutAnchor(scroll){
  const box = $('#msgs'), sp = $('#spacer');
  if (!box || !sp) return;
  const el = S.ui.anchor != null ? box.querySelector(`[data-mi="${S.ui.anchor}"]`) : null;
  if (!el){ if (sp.style.height !== '0px') sp.style.height = '0px'; return; }
  // 合わせる位置：短いメッセージは頭から全部見せる。長いメッセージは最後の一行だけが上に残るところまで上げる
  const tgt = Math.max(0, el.offsetTop - 12, el.offsetTop + el.offsetHeight - 60);
  // 余白を一度0にしないで計算する（毎回0にすると画面がガタつく）
  const spH = sp.offsetHeight;
  const below = box.scrollHeight - spH - tgt;
  const h = Math.max(0, box.clientHeight - below - 4);
  if (Math.abs(h - spH) > 1) sp.style.height = h + 'px';
  if (scroll && Math.abs(box.scrollTop - tgt) > 1) box.scrollTop = tgt;
}
// 送った直後は、キーボードが閉じたりフォントが読み込まれたりして高さが変わるので、少し後にもう一度合わせる
function anchorNow(box){
  layoutAnchor(true);
  let mine = box.scrollTop;
  (window.requestAnimationFrame || (f => setTimeout(f, 16)))(() => { if (box.scrollTop === mine){ layoutAnchor(true); mine = box.scrollTop; } });
  setTimeout(() => { if (box.isConnected && box.scrollTop === mine) layoutAnchor(true); }, 400);
}
// キーボードが出て会話の枠が縮んだら、そのぶん上にずらす（下の端をそろえる）
// 送ったメッセージを上に置いているときは、上の端をそろえたまま余白だけ合わせ直す
let boxObserver = null;
function watchBox(box){
  if (!window.ResizeObserver) return;
  if (boxObserver) boxObserver.disconnect();
  let lastH = box.clientHeight;
  boxObserver = new ResizeObserver(() => {
    const h = box.clientHeight;
    if (h === lastH) return;
    // 送ったメッセージを上に置いている間（指で動かしていなければ）は、枠が変わっても上に置き直す
    if (S.ui.anchor != null && !S.ui.userScrolled) layoutAnchor(true);
    else if (S.ui.anchor != null){ const top = box.scrollTop; layoutAnchor(false); box.scrollTop = top; }
    else box.scrollTop += (lastH - h);
    lastH = h;
  });
  boxObserver.observe(box);
}
// 入力欄の高さを文字に合わせる。測るときに一瞬縮むので、会話の位置を覚えておいてすぐ戻す（打っている間に下へ落ちないように）
function autosize(el){
  const box = $('#msgs');
  const top = box ? box.scrollTop : 0;
  const old = el.style.height;
  el.style.height = 'auto';
  const h = Math.min(el.scrollHeight, window.innerHeight * 0.38) + 'px';
  el.style.height = h;
  if (box && box.scrollTop !== top) box.scrollTop = top;
  if (old === h) return;
}
// 届いた文字はいったん貯めて、一定の速さで流して出す。貯まっているほど速く、全部届いたら一気に出しきる
const streamShown = () => S.stream ? S.stream.text.slice(0, S.stream.shown || 0) : '';
const nextFrame = window.requestAnimationFrame ? f => window.requestAnimationFrame(f) : f => setTimeout(f, 16);
function pump(){
  const st = S.stream;
  if (!st) return;
  const total = st.text.length, back = total - st.shown;
  if (back > 0){
    // 1コマに0.55文字くらいずつ（小数も貯めて、すーっと進める）。貯まっているほど少し速く、全部届いたら素早く出しきる
    let rate = 0.55 + back * 0.008;
    if (st.done) rate = Math.max(rate, back / 24);
    st.acc = (st.acc || 0) + rate;
    const step = Math.floor(st.acc);
    if (step > 0){
      st.acc -= step;
      st.shown = Math.min(total, st.shown + step);
      updateStream();
    }
  } else st.acc = 0;
  if (st.done && st.shown >= st.text.length){ if (st.drained) st.drained(); return; }
  nextFrame(pump);
}
function updateStream(){
  const el = $('#streamText');
  const box = $('#msgs');
  if (!el || !box || !S.stream) return;
  const top = box.scrollTop;
  el.innerHTML = fmt(streamShown());
  // アリサが自分で動かしていなければ、送ったメッセージを上に置いたまま。動かしていたら、その位置のまま
  if (!S.ui.userScrolled) layoutAnchor(true);
  else { layoutAnchor(false); box.scrollTop = top; }
}
function toast(msg){
  const t = document.createElement('div');
  t.className = 'toast'; t.textContent = msg; t.setAttribute('role', 'status');
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 1600);
}
